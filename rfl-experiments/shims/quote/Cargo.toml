[package]
name = "quote"
version = "1.0.40"
edition = "2021"
publish = false

[lib]
path = "../../../rfl-linux/rust/quote/lib.rs"

[features]
default = ["proc-macro"]
proc-macro = ["proc-macro2/proc-macro"]

[dependencies]
proc-macro2 = { version = "1.0.101", default-features = false }

[lints.rust]
unexpected_cfgs = "allow"
