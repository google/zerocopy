[package]
name = "pin-init"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "../../../rfl-linux/rust/pin-init/src/lib.rs"

[features]
default = []
std = []
alloc = []
unsafe-pinned = []

[dependencies]
pin-init-internal = { path = "../pin-init-internal" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kernel)', 'cfg(CONFIG_RUSTC_HAS_UNSAFE_PINNED)', 'cfg(USE_RUSTC_FEATURES)'] }

