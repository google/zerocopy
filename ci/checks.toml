schema_version = 1

[repo]
slug = "google/zerocopy"
id = 534354967
owner_id = 1342004
default_branch = "main"
sigstore = "public_good"
trusted_engine_workflow = "joshlf/ci-core/.github/workflows/ci.yml"
trusted_engine_shas = [
  "5fedc784df34ea7f349897d699be757f10354063",
  "629e371f0c7c4ad4e3a3c98f09b12104f314150e",
]

[tcb]
owner_user_ids = [1046063, 3820879, 1775176]
allow_owner_self_approval = false
non_tcb_workflows = ["scorecard.yml", "dependency-review.yml"]
non_tcb_subtrees = ["evals", "skills", "zerocopy/vendor"]
extra_executable_paths = [
  ".github/release_notes.py",
  ".github/scripts/**",
  "anneal/ci/**",
  "ci/*.py",
  "ci/*.sh",
  "ci/scripts/**",
  "githooks/**",
  "tools/*.py",
  "tools/*.sh",
  "zerocopy/cargo.sh",
  "zerocopy/ci/**",
]

[tcb.caller]
kind = "repo_ruleset"
caller_workflows = [
  ".github/workflows/ci-core-pr.yml",
  ".github/workflows/ci-core-trusted.yml",
]
gate_check_name = "ci-core / gate"
codeowners = ["@joshlf", "@jswrenn", "@mdittmer"]

[commit_policy]
# Character class avoids triggering `ci/check_todo.sh` on this manifest itself.
forbid_message_regex = '\b[T]ODO\b'

# ---------------------------------------------------------------------------
# Declarative Data Pins
# ---------------------------------------------------------------------------

[pins.rust-toolchains]
path = "ci/pins/rust-toolchains.toml"
[pins.rust-toolchains.keys]
msrv = '[0-9]+\.[0-9]+\.[0-9]+'
stable = '[0-9]+\.[0-9]+\.[0-9]+'
nightly = 'nightly-[0-9]{4}-[0-9]{2}-[0-9]{2}'
no-zerocopy-allocator-api-1-100-0 = '[0-9]+\.[0-9]+\.[0-9]+'
no-zerocopy-simd-x86-avx12-1-89-0 = '[0-9]+\.[0-9]+\.[0-9]+'
no-zerocopy-aarch64-simd-be-1-87-0 = '[0-9]+\.[0-9]+\.[0-9]+'
no-zerocopy-core-error-1-81-0 = '[0-9]+\.[0-9]+\.[0-9]+'
no-zerocopy-slice-ptr-len-1-79-0 = '[0-9]+\.[0-9]+\.[0-9]+'
no-zerocopy-diagnostic-on-unimplemented-1-78-0 = '[0-9]+\.[0-9]+\.[0-9]+'
no-zerocopy-generic-bounds-in-const-fn-1-61-0 = '[0-9]+\.[0-9]+\.[0-9]+'
no-zerocopy-target-has-atomics-1-60-0 = '[0-9]+\.[0-9]+\.[0-9]+'
no-zerocopy-aarch64-simd-1-59-0 = '[0-9]+\.[0-9]+\.[0-9]+'
no-zerocopy-panic-in-const-and-vec-try-reserve-1-57-0 = '[0-9]+\.[0-9]+\.[0-9]+'

[pins.kani-pin]
path = "ci/pins/kani-pin.toml"
[pins.kani-pin.keys]
version = '[0-9]+\.[0-9]+\.[0-9]+'
bundle-sha256 = '[0-9a-f]{64}'

[pins.semver-baseline]
path = "ci/pins/semver-baseline.toml"
[pins.semver-baseline.keys]
version = '[0-9]+\.[0-9]+\.[0-9]+'
crate-sha256 = '[0-9a-f]{64}'
skip = 'true|false'
tool-version = '[0-9]+\.[0-9]+\.[0-9]+'
tool-sha256 = '[0-9a-f]{64}'

[pins.layout-seed]
path = "ci/pins/layout-seed.toml"
[pins.layout-seed.keys]
seed = '[0-9]+'

# ---------------------------------------------------------------------------
# Content-Addressed OCI Toolchain Images
# ---------------------------------------------------------------------------

[images.zc-stable-msrv]
dockerfile = "ci/docker/zc-stable-msrv.Dockerfile"
context = [
  { kind = "glob", include = ["tools/cargo-zerocopy/**", "tools/generate-readme/**", "tools/ui-runner/**"], exclude = ["**/target/**"] },
]
pins = ["rust-toolchains", "semver-baseline"]
runner = "ubuntu-24.04"

[images.zc-build-rs-modern]
dockerfile = "ci/docker/zc-build-rs.Dockerfile"
context = [
  { kind = "glob", include = ["tools/cargo-zerocopy/**", "tools/ui-runner/**"], exclude = ["**/target/**"] },
]
pins = ["rust-toolchains"]
build_args = { BUILD_RS_TIER = "modern" }
runner = "ubuntu-24.04"

[images.zc-build-rs-legacy]
dockerfile = "ci/docker/zc-build-rs.Dockerfile"
context = [
  { kind = "glob", include = ["tools/cargo-zerocopy/**", "tools/ui-runner/**"], exclude = ["**/target/**"] },
]
pins = ["rust-toolchains"]
build_args = { BUILD_RS_TIER = "legacy" }
runner = "ubuntu-24.04"

[images.zc-nightly]
dockerfile = "ci/docker/zc-nightly.Dockerfile"
context = [
  { kind = "glob", include = ["tools/cargo-zerocopy/**", "tools/ui-runner/**", "tools/install-cargo-show-asm.sh"], exclude = ["**/target/**"] },
]
pins = ["rust-toolchains"]
runner = "ubuntu-24.04"

[images.zc-kani]
dockerfile = "ci/docker/zc-kani.Dockerfile"
context = []
pins = ["rust-toolchains", "kani-pin"]
runner = "ubuntu-24.04"

[images.anneal-tc]
dockerfile = "ci/docker/anneal-tc.Dockerfile"
context = [
  { kind = "glob", include = [
    "anneal/flake.nix",
    "anneal/flake.lock",
    "anneal/Cargo.toml",
    "anneal/Cargo.lock",
    "anneal/trusted/audit/Cargo.toml",
    "anneal/trusted/cargo-anneal/Cargo.toml",
    "anneal/trusted/rustc-capture/Cargo.toml",
    "anneal/tests/testkit/Cargo.toml",
    "anneal/tests/audit/Cargo.toml",
    "anneal/tests/cargo-anneal/Cargo.toml",
    "anneal/tests/rustc-capture/Cargo.toml",
    "anneal/tests/itree_diff/Cargo.toml",
    "anneal/trusted/lean/lean-toolchain",
    "anneal/trusted/lean/foundation-lock.json",
    "anneal/ci/verify_starnix_e2e.py",
    "anneal/tests/cargo-anneal/tests/fixtures/starnix/source.json",
  ] },
]
runner = "ubuntu-24.04"

[images.anneal-arm64]
dockerfile = "ci/docker/anneal-arm64.Dockerfile"
platform = "linux/arm64"
context = []
pins = ["rust-toolchains"]
runner = "ubuntu-24.04-arm"

# ---------------------------------------------------------------------------
# Content-Addressed Cache Slots
# ---------------------------------------------------------------------------

[caches.miri-v1]
mount = "/ci-cache/miri"
tier = "public_cas"
inputs = [
  { kind = "glob", include = [
    "anneal/flake.nix",
    "anneal/flake.lock",
    "anneal/trusted/lean/lean-toolchain",
    "anneal/trusted/lean/foundation-lock.json",
    "anneal/vendor/lean-miri/UPSTREAM_PIN.json",
  ] },
]

[caches.zc-miri-sysroot-v1]
mount = "/ci-cache/zc-miri"
env_keys = ["TARGET", "MIRI_MODEL"]
inputs = [
  { kind = "glob", include = ["ci/pins/layout-seed.toml"] },
]

[caches.exocrate-cargo-v1]
mount = "/cargo-home"
cargo_locked = { workspace = "exocrate/Cargo.toml" }

[caches.anneal-mir-eval-cargo-v1]
mount = "/cargo-home"
cargo_locked = { workspace = "tools/anneal-mir-eval/Cargo.toml" }

[caches.anneal-cargo-v1]
mount = "/cargo-home"
cargo_locked = { workspace = "anneal/Cargo.toml" }

