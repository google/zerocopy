[workspace]

[package]
name = "kani-contract-dependency-fixture"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["positive"]
positive = []
missing_provider = []
wrong_instance = []
mutual_cycle = []
generator_reentry = []
stub_requires = []
false_callee = []
narrow_output = []
full_output = []

[dependencies]
zerocopy-kani-macros = { path = "../.." }
