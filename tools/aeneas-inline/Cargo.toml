[package]
name = "aeneas-inline"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
rustc_lexer = "=0.1.0"
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
