[package]
name = "anneal-lower-cpp"
version = "0.0.0"
edition = "2021"
publish = false
description = "Lowers anneal-clang-dump RawCppBundle JSON into Trusted.CppAst Lean terms"
license = "BSD-2-Clause OR Apache-2.0 OR MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "anneal-lower-cpp"
path = "src/main.rs"

[dependencies]
anneal-lower-common = { path = "../lower-common" }
serde_json = "1"
