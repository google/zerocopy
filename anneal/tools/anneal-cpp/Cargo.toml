# Standalone workspace for the untrusted C/C++ frontend tools. It is excluded
# from the root `anneal/` workspace so `anneal-audit`'s Cargo boundary keeps
# these crates in zone 2 (`tools/`).
[workspace]
resolver = "2"
members = ["lower-common", "lower-cpp"]
