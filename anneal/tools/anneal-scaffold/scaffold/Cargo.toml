[package]
name = "anneal-scaffold"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
publish = false
description = "Generate identity-keyed AutoScaffold.lean modules from Anneal captures."

[lib]
name = "anneal_scaffold"
path = "src/lib.rs"

[[bin]]
name = "anneal-scaffold"
path = "src/main.rs"

[dependencies]
# `unbounded_depth` lets `render` lift the parser's fixed nesting limit of 128
# after bounding the nesting itself.
serde_json = { version = "1.0.154", features = ["unbounded_depth"] }
