[package]
name = "anneal-spec-lower"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
publish = false
description = "Lower Rust-syntax Anneal surface specifications to Spec.lean."

[[bin]]
name = "anneal-spec-lower"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
serde_json = "1.0.154"
syn = { version = "2.0.119", features = ["full"] }
