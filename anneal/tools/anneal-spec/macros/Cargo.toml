[package]
name = "anneal-spec"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
publish = false
description = "Inert, syntax-checking `anneal::spec` attributes and `anneal::external_spec!`."

[lib]
# Users write `#[anneal::spec(...)]`, so the library crate is named `anneal`.
name = "anneal"
proc-macro = true

[dependencies]
anneal-spec-lower = { path = "../lower" }
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
