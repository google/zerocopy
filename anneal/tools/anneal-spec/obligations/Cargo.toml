[package]
name = "anneal-obligations"
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
publish = false
description = "Report a per-function evidence ledger from Anneal receipts, requests, and specifications."

[[bin]]
name = "cargo-anneal-obligations"
path = "src/main.rs"

[dependencies]
anneal-spec-lower = { path = "../lower" }
serde_json = "1.0.154"
