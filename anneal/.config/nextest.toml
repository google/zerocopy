# `cargo-nextest` profiles for `anneal/` (providing per-test OS process
# isolation and slow-test slot throttling; `cargo test --workspace --locked`
# remains 100% supported).

[profile.default]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }
fail-fast = false

# Heavy integration binaries and corpus runners that spawn multiple Lean
# workers per test. `selected_unit_normalization_and_boundary_rejections`
# joins them because it runs 21 sequential `cargo anneal verify` calls (7
# full Lean verifications), taking from 74s to over 120s on CI runners.
# Listed ahead of the general slow-test override below so overlapping tests
# (such as correspondence checks in `boundary_audit`) keep the 60s
# slow-timeout period.
[[profile.default.overrides]]
filter = 'binary(differential_oracle)'
threads-required = 2
slow-timeout = { period = "90s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'binary(boundary_audit) | binary(target_audit) | binary(profile_v2_e2e) | test(/verifies_scalar_spec_corpus|selected_unit_normalization_and_boundary_rejections/) | test(/sharded_cyclic_crate_verifies_cross_shard_dag_id_tree_and_incremental_cache/)'
threads-required = 2
slow-timeout = { period = "60s", terminate-after = 4 }

# End-to-end bundled `Anneal.AiPcc` tests compile `AiPcc` plus capture
# `zerocopy/src/` inside `cargo-anneal verify`.
[[profile.default.overrides]]
filter = 'binary(aipcc_e2e)'
threads-required = 2
slow-timeout = { period = "60s", terminate-after = 4 }

# `kernel_physics` compiles `trusted/lean` and the bundled theory with four
# single-threaded Lean workers before running its census.
[[profile.default.overrides]]
filter = 'binary(kernel_physics)'
threads-required = 4
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'binary(itree_differential) | binary(profile_v2_canaries)'
threads-required = 2
slow-timeout = { period = "90s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(/ndjson_quorum|correspondence|scale_|real_crates/)'
threads-required = 2
slow-timeout = { period = "45s", terminate-after = 4 }

[profile.ci]
retries = 0
slow-timeout = { period = "30s", terminate-after = 4 }
status-level = "pass"
final-status-level = "slow"
