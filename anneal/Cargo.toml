[workspace]
resolver = "2"
# Keep a three-zone monotonic dependency boundary across production TCB crates
# under `trusted/` (zone 0), non-shipping test/harness crates under `tests/`
# (zone 1), and untrusted standalone tools under `tools/` (zone 2):
# `tests/*` crates may depend on `trusted/*` and `tests/*`, while `trusted/*`
# may never depend on `tests/*` or `tools/*`, and `tests/*` may never depend on
# `tools/*` (enforced mechanically by `check_cargo_boundary` in `anneal-audit`).
members = [
    "trusted/audit",
    "trusted/cargo-anneal",
    "trusted/rustc-capture",
    "tests/testkit",
    "tests/audit",
    "tests/cargo-anneal",
    "tests/itree_diff",
    "tests/rustc-capture",
    "tests/differential",
]
exclude = [
    "tools/anneal-cpp",
    "tools/anneal-scaffold",
    "tools/anneal-spec",
]
