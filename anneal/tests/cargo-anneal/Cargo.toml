# Integration tests for `cargo-anneal`, kept outside `trusted/` so non-TCB test
# harnesses and fixtures do not inflate the human-audited TCB surface.
# `check_cargo_boundary` enforces the two-zone monotonic lattice (`tests/*` ->
# `trusted/*` or `tests/testkit`, never `trusted/*` -> `tests/*`).

[package]
name = "cargo-anneal-tests"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["setup"]
# Mirrors `cargo-anneal`'s optional `setup` feature so offline CLI tests
# (`--no-default-features --test cli`) compile and run with zero `exocrate`
# dependency in the Cargo graph.
setup = ["cargo-anneal/setup", "dep:exocrate"]

[dependencies]
cargo-anneal = { path = "../../trusted/cargo-anneal", default-features = false }
exocrate = { version = "0.3.1", optional = true }

[dev-dependencies]
anneal-testkit = { path = "../testkit" }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27"
wait-timeout = "0.2"
zstd = "0.13"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
