# Integration tests for `anneal-rustc-capture`, kept outside `trusted/` so
# non-TCB test harnesses do not inflate the human-audited TCB surface. The
# dependency edge is strictly one-way (`tests/` -> `trusted/`, never
# `trusted/` -> `tests/`), enforced mechanically by `check_cargo_boundary`.

[package]
name = "anneal-rustc-capture-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anneal-rustc-capture = { path = "../../trusted/rustc-capture" }

[dev-dependencies]
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
