# Integration tests for `anneal-rustc-capture`, kept outside `trusted/` so
# non-TCB test harnesses do not inflate the human-audited TCB surface.
# `check_cargo_boundary` enforces the two-zone monotonic lattice (`tests/*` ->
# `trusted/*` or `tests/testkit`, never `trusted/*` -> `tests/*`).

[package]
name = "anneal-rustc-capture-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anneal-rustc-capture = { path = "../../trusted/rustc-capture" }

[dev-dependencies]
anneal-testkit = { path = "../testkit" }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
