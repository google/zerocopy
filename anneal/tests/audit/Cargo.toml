# Integration tests for `anneal-audit`, kept outside `trusted/` so non-TCB test
# harnesses do not inflate the human-audited TCB surface. `check_cargo_boundary`
# enforces the two-zone monotonic lattice (`tests/*` -> `trusted/*` or
# `tests/testkit`, never `trusted/*` -> `tests/*`).

[package]
name = "anneal-audit-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anneal-audit = { path = "../../trusted/audit" }

[dev-dependencies]
anneal-testkit = { path = "../testkit" }
cargo-anneal = { path = "../../trusted/cargo-anneal", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
toml = "0.9"
walkdir = "2.5"
