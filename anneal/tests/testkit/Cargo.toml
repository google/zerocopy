# Shared test scaffolding for fenced `anneal/tests/` suites.
#
# Excluded from crates.io publication (`publish = false`) and kept free of
# `rustc_private` dependencies so it compiles once across stable and nightly
# Rust toolchains under the two-zone monotonic lattice enforced by
# `check_cargo_boundary`.

[package]
name = "anneal-testkit"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
doctest = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
