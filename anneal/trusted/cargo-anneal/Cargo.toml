[package]
name = "cargo-anneal"
# FIXME(#4012): We must address all blockers listed in #4012 before permitting
# stable releases.
version = "0.2.0-alpha.9"
edition = "2024"
description = "Formally verify Rust programs in Lean 4."
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
documentation = "https://github.com/google/zerocopy/tree/main/anneal/docs"
repository = "https://github.com/google/zerocopy/tree/main/anneal"
readme = "../../README.md"
categories = [
    "development-tools::cargo-plugins",
    "development-tools::testing",
]
keywords = ["formal-verification", "lean", "proof", "unsafe", "verification"]
exclude = [
    "tests/*.rs",
    "tests/support/",
    "tests/fixtures/*.rs",
    "tests/fixtures/spin/",
    "tests/fixtures/starnix/",
    "tests/fixtures/unsafe_identity/",
    "tests/fixtures/scalar/dependency.rs",
    "tests/fixtures/scalar/unsupported.rs",
]

# Release preparation pins the published x86-64 Linux archive before
# crates.io publication. An all-zero digest keeps remote setup disabled.
[[package.metadata.exocrate]]
os = "linux"
arch = "x86_64"
sha256 = "5f20ed60788c57eec9224f7cf969166cd5188530f50718a8e3e4d03a654651b4"
url = "https://github.com/google/zerocopy/releases/download/anneal-toolchain-v0.2.0-alpha.9/anneal-toolchain-linux-x86_64.tar.zst"

[[bin]]
name = "cargo-anneal"

[[example]]
name = "regenerate_bundle"
test = true

[features]
default = ["setup"]
setup = ["dep:exocrate"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
exocrate = { version = "0.3.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
walkdir = "2.5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tar = "0.4"
wait-timeout = "0.2"
zstd = "0.13"
