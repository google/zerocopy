[package]
name = "cargo-anneal"
# FIXME(#87): We must address all blockers listed in #87 before permitting
# stable releases.
version = "0.1.0-alpha.1"
edition = "2024"
description = "Formally verify Rust programs in Lean 4."
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
repository = "https://github.com/google/zerocopy/tree/main/anneal"

# FIXME: Replace these placeholder archive URLs and hashes before publishing
# this crate; `cargo anneal setup` uses this metadata by default when callers
# do not provide a local archive.
[[package.metadata.exocrate]]
os = "linux"
arch = "x86_64"
sha256 = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
url = "https://example.com/linux-x86_64.tar.zst"

[[package.metadata.exocrate]]
os = "linux"
arch = "aarch64"
sha256 = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
url = "https://example.com/linux-aarch64.tar.zst"

[[package.metadata.exocrate]]
os = "macos"
arch = "x86_64"
sha256 = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
url = "https://example.com/macos-x86_64.tar.zst"

[[package.metadata.exocrate]]
os = "macos"
arch = "aarch64"
sha256 = "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"
url = "https://example.com/macos-aarch64.tar.zst"

[[bin]]
name = "cargo-anneal"
required-features = ["setup"]

[[example]]
name = "regenerate_bundle"
test = true

[features]
default = ["setup"]
setup = ["dep:exocrate"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
exocrate = { version = "0.3.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"
walkdir = "2.5"

[dev-dependencies]
tar = "0.4"
wait-timeout = "0.2"
zstd = "0.13"
