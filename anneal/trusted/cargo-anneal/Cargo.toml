[package]
name = "cargo-anneal"
# FIXME(#4012): We must address all blockers listed in #4012 before permitting
# stable releases.
version = "0.2.0-alpha.12"
edition = "2024"
description = "Formally verify Rust programs in Lean 4."
license = "BSD-2-Clause OR Apache-2.0 OR MIT"
documentation = "https://github.com/google/zerocopy/tree/main/anneal/docs"
repository = "https://github.com/google/zerocopy/tree/main/anneal"
readme = "../../README.md"
categories = [
    "development-tools::cargo-plugins",
    "development-tools::testing",
]
keywords = ["formal-verification", "lean", "proof", "unsafe", "verification"]

# Release preparation pins the published x86-64 Linux archive before
# crates.io publication. An all-zero digest keeps remote setup disabled.
[[package.metadata.exocrate]]
os = "linux"
arch = "x86_64"
sha256 = "cbf5e6d8b3f12afc8116283566f5dccf06c9b27e38e7c6d3d2c6025a6b825307"
url = "https://github.com/google/zerocopy/releases/download/anneal-toolchain-v0.2.0-alpha.12/anneal-toolchain-linux-x86_64.tar.zst"

[[bin]]
name = "cargo-anneal"

[[example]]
name = "regenerate_bundle"
test = true

[features]
default = ["setup"]
setup = ["dep:exocrate", "dep:zstd"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
exocrate = { version = "0.3.1", optional = true }
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27"
thiserror = "2.0"
toml = "0.9"
walkdir = "2.5"
zstd = { version = "0.13", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"

[dev-dependencies]
zstd = "0.13"
