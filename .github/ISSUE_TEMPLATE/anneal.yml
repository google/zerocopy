name: Anneal / Exocrate issue
description: File a bug, task, or design issue for Anneal or Exocrate
type: Task
labels:
  - anneal
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Select the primary area.
      options:
        - anneal (MIR capture / auditor / theory / cargo-anneal)
        - exocrate
        - CI / packaging / docs
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: >-
        Describe the issue, design question, or verification gap, including
        relevant commit SHAs or paths.
    validations:
      required: true
