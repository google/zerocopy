# SPDX-License-Identifier: BSD-2-Clause OR Apache-2.0 OR MIT
# Temporary publication runner; this file is not part of PR #3677.
name: Audit pointer review publication
'on':
  push:
    branches: [joshlf/audit-pointer-review-runner-20260912]
permissions:
  contents: read
concurrency:
  group: audit-pointer-review-publication
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_ZEROCOPY_AUTO_INSTALL_TOOLCHAIN: '1'
      CARGO_TERM_COLOR: always
      EXPECTED_BASE: 5946b5f6d48dcce3cc4799a480a45cf5b78f8006
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings --cfg=zerocopy_unstable_ptr
    steps:
      - name: Check out the verified PR head, not this runner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5946b5f6d48dcce3cc4799a480a45cf5b78f8006
          fetch-depth: 0
          persist-credentials: false
      - name: Apply explicit replacements to the pinned source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/joshlf/audit-pointer-contracts-20260912 | cut -f1)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          import subprocess
          import textwrap
          from pathlib import Path

          def replace(file, old, new, indent=0):
              path = Path('zerocopy/src') / file
              before = path.read_text()
              old = textwrap.indent(textwrap.dedent(old).strip('\n') + '\n', ' ' * indent)
              new = textwrap.indent(textwrap.dedent(new).strip('\n') + '\n', ' ' * indent)
              assert before.count(old) == 1, (file, 'replacement anchor count', before.count(old), old)
              path.write_text(before.replace(old, new))

          replace('impls.rs', '''
          // SAFETY: `ManuallyDrop<T>` has the same layout and bit validity as
          // `T` [1].
          ''', '''
          // SAFETY: `ManuallyDrop<T>` has the same layout and bit validity as
          // `T` [1]. The cast preserves the address of the non-null input and
          // its provenance, including when the referent is zero-sized.
          ''', 12)

          replace('impls.rs', '''
          let slf = slf.as_non_null().as_ptr();
          // SAFETY: `PtrInner` promises it references either a zero-sized
          // byte range, or else will reference a byte range that is
          // entirely contained within an allocated object. In either
          // case, this guarantees that `(*slf).$CurrI` is in-bounds of
          // `slf`.
          unsafe { core::ptr::addr_of_mut!((*slf).$CurrI) }
          ''', '''
          if core::mem::size_of::<Self>() == 0 {
              // The tuple and this field have size zero. This cast preserves
              // the input's non-null address and provenance, and the empty
              // referent is a subset of the input. No field-offset assumption
              // or allocation is needed to meet the projection contract.
              return slf.as_ptr().cast::<Self::Type>();
          }
          let slf = slf.as_non_null().as_ptr();
          // SAFETY: The non-zero-sized tuple lies within one allocation by
          // invariant on `PtrInner`. Its field address is in that allocation
          // or one-past its end, and computing it does not wrap. Allocations
          // have non-null bases and nonwrapping address ranges [1], so the
          // result is non-null even for a zero-sized field. Field projection
          // preserves provenance and selects a subset of the tuple's bytes.
          //
          // [1] Per https://doc.rust-lang.org/1.92.0/std/ptr/index.html#allocation:
          //
          //   base is not equal to null()
          //   ...
          //   base + size <= usize::MAX
          unsafe { core::ptr::addr_of_mut!((*slf).$CurrI) }
          ''', 20)

          replace('impls.rs', '''
          mod tests {
              use super::*;
          ''', '''
          mod tests {
              use super::*;

              #[test]
              fn zst_field_projections_are_non_null() {
                  type Tuple = ((), ());
                  let value = ((), ());
                  let pointer = PtrInner::from_ref(&value);
                  let projected = <Tuple as HasField<(), (), { STRUCT_VARIANT_ID }, { ident_id!(1) }>>::project(pointer);
                  assert_eq!(projected, pointer.as_ptr().cast::<()>());

                  let pointer = core::ptr::NonNull::<Tuple>::dangling();
                  // SAFETY: `Tuple` is zero-sized. `PtrInner::new` requires no
                  // allocation or live provenance for a zero-sized referent.
                  let pointer = unsafe { PtrInner::new(pointer) };
                  let projected = <Tuple as HasField<(), (), { STRUCT_VARIANT_ID }, { ident_id!(1) }>>::project(pointer);
                  assert_eq!(projected, pointer.as_ptr().cast::<()>());

                  // A zero-sized field of a non-zero-sized tuple.
                  let value = (0u8, ());
                  let pointer = PtrInner::from_ref(&value);
                  let projected = <(u8, ()) as HasField<(), (), { STRUCT_VARIANT_ID }, { ident_id!(1) }>>::project(pointer);
                  assert!(!projected.is_null());

                  let value = ReadOnly::new(((), ()));
                  let pointer = PtrInner::from_ref(&value);
                  let projected = <ReadOnly<Tuple> as HasField<(), (), { STRUCT_VARIANT_ID }, { ident_id!(1) }>>::project(pointer);
                  assert_eq!(projected, pointer.as_ptr().cast::<ReadOnly<()>>());
              }
          ''')

          replace('layout.rs', '''
          // more detailed proof of this). It does this using provenance-preserving
          // operations.
          ''', '''
          // more detailed proof of this). The input data-pointer cast and
          // `KnownLayout::raw_from_ptr_len` both preserve its address and
          // provenance. Thus the result is non-null even for a zero-sized referent.
          ''', 4)

          replace('pointer/mod.rs', '''
          // provenance-preserving projection which preserves the set of referent
          // bytes.
          ''', '''
          // provenance-preserving projection which preserves the address and set of
          // referent bytes. The input is non-null by invariant on `PtrInner`, so
          // the result is non-null regardless of referent size.
          ''', 4)
          replace('pointer/mod.rs', '''
          // and so all casts preserve or shrink the set of referent bytes. All
          // operations preserve provenance.
          ''', '''
          // and so all casts preserve or shrink the set of referent bytes. The
          // pointer cast preserves the input's non-null address and provenance,
          // including when the destination is zero-sized.
          ''', 4)
          replace('pointer/mod.rs', '''
          // and so all casts preserve the set of referent bytes. All operations
          // preserve provenance.
          ''', '''
          // and so all casts preserve the set of referent bytes. The pointer cast
          // preserves the input's non-null address and provenance, including for
          // zero-sized referents.
          ''', 4)
          replace('pointer/mod.rs', '''
          //   trailing padding). Thus, `project` preserves the set of referent bytes.
          ''', '''
          //   trailing padding). Thus, `project` preserves the set of referent bytes.
          // The data-pointer cast and `KnownLayout::raw_from_ptr_len` preserve the
          // input's address and provenance, so the result is non-null, including
          // when the referent is zero-sized.
          ''', 4)
          replace('pointer/mod.rs', '''
          // SAFETY: Since `TU::project` and `UV::project` are each
          // provenance-preserving operations which preserve or shrink the set of
          // referent bytes, so is their composition.
          ''', '''
          // SAFETY: `TU::project` and `UV::project` each promise a non-null result,
          // the same provenance, and a subset of the input's referent bytes.
          // `PtrInner::project` preserves those properties between the calls, so
          // their composition satisfies all three postconditions, including for
          // zero-sized intermediate and final referents.
          ''', 4)
          replace('pointer/mod.rs', '''
          // and with a referent of the same size as `*src`. It does this using
          // provenance-preserving operations.
          ''', '''
          // and with a referent of the same size as `*src`. This preserves the
          // input's non-null address, even for an empty slice. All operations
          // preserve provenance.
          ''', 4)
          replace('pointer/mod.rs', '''
          // argument's referent using provenance-preserving operations.
          ''', '''
          // argument's referent using an address- and provenance-preserving cast.
          // The empty output referent is a subset of any input referent, and the
          // input's non-null address is preserved.
          ''', 4)

          replace('ref.rs', '''
          // this cast has the same size as `ptr`'s referent. All operations preserve
          // provenance.
          ''', '''
          // this cast has the same size as `ptr`'s referent. The input data-pointer
          // cast and `KnownLayout::raw_from_ptr_len` preserve the input's non-null
          // address and provenance, including when that size is zero.
          ''', 4)
          replace('util/macros.rs', '''
          // preserving or size-shrinking cast. All operations preserve
          // provenance.
          ''', '''
          // preserving or size-shrinking cast. The pointer cast preserves the
          // input's non-null address and provenance, including for zero-sized
          // source or destination referents.
          ''', 8)

          replace('wrappers.rs', '''
          // produces a pointer with the same referent. By invariant, for any
          ''', '''
          // produces a pointer with the same address and referent, preserving
          // non-nullness even for a zero-sized referent. The following projection
          // also promises a non-null result by its `Project` contract. Thus the
          // composition is non-null. By invariant, for any
          ''', 4)
          replace('wrappers.rs', '''
          // `project` satisfies its post-condition – namely, that the returned pointer
          // refers to a non-strict subset of the bytes of `slf`'s referent, and has the
          // same provenance as `slf` – because all intermediate operations satisfy those
          // same conditions.
          ''', '''
          // `project` preserves provenance and returns a subset of `slf`'s referent
          // bytes because each intermediate projection promises both properties.
          // The first and last projections are address-preserving casts. Between
          // them, `T::project` promises a non-null result by `HasField`'s contract.
          // Thus all three projections produce non-null results, independently of
          // whether the source, intermediate, or final referents are zero-sized.
          ''')

          expected = sorted(['zerocopy/src/' + path for path in [
              'impls.rs', 'layout.rs', 'pointer/mod.rs', 'ref.rs',
              'util/macros.rs', 'wrappers.rs',
          ]])
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert sorted(changed) == expected, changed
          PY
          git diff --check
          git diff --stat
          git diff
      - name: Format and validate tests, derives, and documentation
        shell: bash
        run: |
          set -euo pipefail
          cd zerocopy
          ./cargo.sh +nightly fmt --all
          ./cargo.sh +msrv test -p zerocopy --lib zst_field_projections_are_non_null
          ./cargo.sh +stable test -p zerocopy --lib pointer::
          ./cargo.sh +stable test -p zerocopy-derive --test pointer_iterators
          ./cargo.sh +stable test -p zerocopy-derive --lib output_tests
          ./cargo.sh +msrv check --tests --features __internal_use_only_features_that_work_on_stable
          ./cargo.sh +nightly clippy --tests --all-features --workspace -- -Dwarnings
          ./cargo.sh +nightly rustdoc --all-features
          ./cargo.sh +nightly fmt --all -- --check
      - name: Validate the ZST regression with Miri
        shell: bash
        run: |
          set -euo pipefail
          cd zerocopy
          nightly="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["metadata"]["ci"]["pinned-nightly"])')"
          rustup component add miri --toolchain "$nightly"
          ./cargo.sh +nightly miri test -p zerocopy --lib zst_field_projections_are_non_null
      - name: Publish only an isolated staging ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          command -v gh
          python3 - <<'PY'
          import subprocess
          expected = sorted(['zerocopy/src/' + path for path in [
              'impls.rs', 'layout.rs', 'pointer/mod.rs', 'ref.rs',
              'util/macros.rs', 'wrappers.rs',
          ]])
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert sorted(changed) == expected, changed
          assert not subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True)
          PY
          git diff --check
          git add -- zerocopy/src/impls.rs zerocopy/src/layout.rs zerocopy/src/pointer/mod.rs zerocopy/src/ref.rs zerocopy/src/util/macros.rs zerocopy/src/wrappers.rs
          git -c user.name="Josh Liebow-Feeser's Agent" -c user.email=agent@joshlf.invalid commit -m 'Establish non-nullness throughout pointer projections' -m 'Explain how the handwritten projections and their adapters produce non-null pointers. For wholly zero-sized tuples, use an address-preserving cast rather than relying on field offsets. Test allocated and dangling zero-sized projections and the ReadOnly adapter.' -m "Agent-Authored-By: AI agent acting on Josh Liebow-Feeser's behalf"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          stage_branch="joshlf/audit-pointer-review-stage-${GITHUB_RUN_ID}"
          test -z "$(git ls-remote origin "refs/heads/$stage_branch")"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$stage_branch"
          printf 'Staged commit: `%s`\n\nStaging branch: `%s`\n' "$(git rev-parse HEAD)" "$stage_branch" >> "$GITHUB_STEP_SUMMARY"
          echo "STAGED_COMMIT=$(git rev-parse HEAD)"
          echo "STAGING_BRANCH=$stage_branch"
