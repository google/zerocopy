name: Anneal Tests

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current_anneal:
    name: Current Anneal
    uses: ./.github/workflows/anneal-current.yml

  all-jobs-succeed:
    # This name is configured in Zerocopy's branch protection.
    name: All checks succeeded (anneal.yml)
    if: ${{ always() }}
    runs-on: ubuntu-latest
    needs: [current_anneal]
    steps:
      - name: Require every dependency to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$NEEDS_JSON"
