name: Build & Tests

# Quote this key so YAML 1.1 parsers do not interpret it as a boolean.
'on':
  push:
    branches:
      - main
  pull_request:
  merge_group:
  # Useful for manually testing changes to this workflow. Because we check for
  # the merge queue by doing `github.event_name != 'pull_request'` rather than
  # `github.event_name == 'merge_group'`, triggering via workflow dispatch has
  # the effect of running all jobs, including those which would normally only be
  # run in the merge queue.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # These are bounded, client-native retries for recognized transient download
  # failures. They never rerun a Cargo or rustup command, so deterministic build
  # and test failures still fail immediately. Keep these values coordinated
  # with the CI Dockerfile.
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # These two values are the producer/consumer protocol for the matrix's CI
  # image. `build_docker_env` must export this tag into this archive, each
  # consumer must load that archive, and the Docker shell wrapper must run this
  # tag. Keep the protocol centralized here rather than duplicating literals in
  # the upload/download actions.
  ZC_CI_IMAGE: zerocopy-ci:local
  ZC_CI_IMAGE_ARCHIVE: zerocopy-ci.tar.zst
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings --cfg=zerocopy_unstable_ptr
  # `ZC_NIGHTLY_XXX` are flags that we add to `XXX` only on the nightly
  # toolchain.
  ZC_NIGHTLY_RUSTFLAGS: -Zrandomize-layout
  ZC_NIGHTLY_MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-backtrace=full"
  CARGO_ZEROCOPY_AUTO_INSTALL_TOOLCHAIN: 1

jobs:
  detect_changes:
    name: Detect Zerocopy changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONS_CACHE_URL: ""
      ACTIONS_RESULTS_URL: ""
      ACTIONS_RUNTIME_TOKEN: ""
    outputs:
      run_zerocopy: ${{ steps.filter.outputs.run_zerocopy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import re
          import subprocess
          import sys

          if os.environ["EVENT_NAME"] != "pull_request":
              print("run_zerocopy=true")
              sys.exit(0)

          SHA_RE = re.compile(r"^[0-9a-fA-F]{40}$")

          def git_paths(cmd):
              res = subprocess.run(cmd, capture_output=True)
              if res.returncode != 0:
                  return None
              return [
                  p.decode("utf-8", "surrogateescape")
                  for p in res.stdout.split(b"\0")
                  if p
              ]

          def diff_names(*args):
              return git_paths([
                  "git", "-c", "core.quotepath=false",
                  "diff", "--name-only", "--no-renames", "-z", *args, "--",
              ])

          def log_names(rev_range):
              return git_paths([
                  "git", "-c", "core.quotepath=false",
                  "log", "-m", "--format=",
                  "--name-only", "--no-renames", "-z", rev_range, "--",
              ])

          ok = True
          paths = set()
          parents_res = subprocess.run(
              ["git", "rev-list", "--parents", "-n", "1", "HEAD"],
              capture_output=True,
              text=True,
          )
          if parents_res.returncode != 0:
              ok = False
              head_oid = ""
              parents = []
          else:
              tokens = parents_res.stdout.strip().split()
              head_oid = tokens[0] if tokens else ""
              parents = tokens[1:]

          base_sha = os.environ.get("PR_BASE_SHA", "")
          head_sha = os.environ.get("PR_HEAD_SHA", "")
          if not SHA_RE.fullmatch(base_sha) or not SHA_RE.fullmatch(head_sha):
              ok = False

          is_synthetic_merge = (
              len(parents) == 2 and parents[1] == head_sha
          )
          if head_oid != head_sha and not is_synthetic_merge:
              ok = False

          pr_tip = head_sha if SHA_RE.fullmatch(head_sha) else "HEAD"

          if ok:
              for batch in (
                  diff_names(f"{base_sha}...HEAD"),
                  log_names(f"{base_sha}..{pr_tip}"),
              ):
                  if batch is None:
                      ok = False
                  else:
                      paths.update(batch)

          if ok and is_synthetic_merge:
              d_merge = diff_names("HEAD^1", "HEAD")
              if d_merge is None:
                  ok = False
              else:
                  paths.update(d_merge)

          if ok:
              for batch in (
                  diff_names("refs/remotes/origin/main...HEAD"),
                  log_names(f"refs/remotes/origin/main..{pr_tip}"),
              ):
                  if batch is None:
                      ok = False
                  else:
                      paths.update(batch)

          only_anneal = (
              ok
              and bool(paths)
              and all(p.startswith("anneal/") for p in paths)
          )
          print(f"run_zerocopy={'false' if only_anneal else 'true'}")
          PY

  build_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # We pre-compute a Docker image containing most dependencies. Each job in
    # the matrix runs in parallel, so without this pre-computation, most jobs
    # would duplicate the work of downloading crates from the internet.
    # Pre-computing ensures that this work only happens once.
    needs: [detect_changes, build_docker_env]
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    permissions:
      contents: read
    defaults:
      run:
        shell: /tmp/docker-shell.sh {0} # zizmor: ignore[misfeature] (CI intentionally routes build matrix commands through the prebuilt Docker image)
        working-directory: zerocopy

    strategy:
      # By default, this is set to `true`, which means that a single CI job
      # failure will cause all outstanding jobs to be canceled. This slows down
      # development because it means that errors need to be encountered and
      # fixed one at a time.
      fail-fast: false
      matrix:
        # See `INTERNAL.md` for an explanation of these pinned toolchain
        # versions.
        toolchain: [
          "msrv",
          "stable",
          "nightly",

          # These are the names of specific Rust versions detected in
          # `build.rs`. Each of these represents the minimum Rust version for
          # which a particular feature is supported.
          "no-zerocopy-allocator-api-1-100-0",
          "no-zerocopy-simd-x86-avx12-1-89-0",
          "no-zerocopy-core-error-1-81-0",
          "no-zerocopy-slice-ptr-len-1-79-0",
          "no-zerocopy-diagnostic-on-unimplemented-1-78-0",
          "no-zerocopy-generic-bounds-in-const-fn-1-61-0",
          "no-zerocopy-target-has-atomics-1-60-0",
          "no-zerocopy-aarch64-simd-1-59-0",
          "no-zerocopy-aarch64-simd-be-1-87-0",
          "no-zerocopy-panic-in-const-and-vec-try-reserve-1-57-0"
        ]
        # Run native x86 targets individually so their test suites execute in
        # parallel, and batch all non-native cross targets into a single `cross`
        # matrix cell per `(crate, toolchain, feature_profile)` to avoid
        # repeating Docker image downloads, loads, and host-side Cargo builds.
        target: [
          "i686-unknown-linux-gnu",
          "x86_64-unknown-linux-gnu",
          "cross"
        ]
        feature_profile: &feature_profiles ["default", "stable", "all"]
        crate: &build_crates ["zerocopy", "zerocopy-derive"]
        event_name: [ "${{ github.event_name }}" ]
        exclude:
          # Exclude any combination which uses a non-nightly toolchain but
          # enables nightly features.
          - toolchain: "msrv"
            feature_profile: "all"
          - toolchain: "stable"
            feature_profile: "all"
          - toolchain: "no-zerocopy-allocator-api-1-100-0"
            feature_profile: "all"
          - toolchain: "no-zerocopy-simd-x86-avx12-1-89-0"
            feature_profile: "all"
          - toolchain: "no-zerocopy-core-error-1-81-0"
            feature_profile: "all"
          - toolchain: "no-zerocopy-slice-ptr-len-1-79-0"
            feature_profile: "all"
          - toolchain: "no-zerocopy-diagnostic-on-unimplemented-1-78-0"
            feature_profile: "all"
          - toolchain: "no-zerocopy-generic-bounds-in-const-fn-1-61-0"
            feature_profile: "all"
          - toolchain: "no-zerocopy-target-has-atomics-1-60-0"
            feature_profile: "all"
          - toolchain: "no-zerocopy-aarch64-simd-1-59-0"
            feature_profile: "all"
          - toolchain: "no-zerocopy-aarch64-simd-be-1-87-0"
            feature_profile: "all"
          - toolchain: "no-zerocopy-panic-in-const-and-vec-try-reserve-1-57-0"
            feature_profile: "all"
          # Exclude any combination for the zerocopy-derive crate which
          # uses zerocopy features.
          - crate: "zerocopy-derive"
            feature_profile: "stable"
          - crate: "zerocopy-derive"
            feature_profile: "all"
          # Exclude any combination of zerocopy-derive and any toolchain version
          # other than "msrv", "stable", and "nightly". These other versions
          # exist to exercise zerocopy behavior which differs by toolchain;
          # zerocopy-derive doesn't behave differently on these toolchains.
          - crate: "zerocopy-derive"
            toolchain: "no-zerocopy-allocator-api-1-100-0"
          - crate: "zerocopy-derive"
            toolchain: "no-zerocopy-simd-x86-avx12-1-89-0"
          - crate: "zerocopy-derive"
            toolchain: "no-zerocopy-core-error-1-81-0"
          - crate: "zerocopy-derive"
            toolchain: "no-zerocopy-slice-ptr-len-1-79-0"
          - crate: "zerocopy-derive"
            toolchain: "no-zerocopy-diagnostic-on-unimplemented-1-78-0"
          - crate: "zerocopy-derive"
            toolchain: "no-zerocopy-generic-bounds-in-const-fn-1-61-0"
          - crate: "zerocopy-derive"
            toolchain: "no-zerocopy-target-has-atomics-1-60-0"
          - crate: "zerocopy-derive"
            toolchain: "no-zerocopy-aarch64-simd-1-59-0"
          - crate: "zerocopy-derive"
            toolchain: "no-zerocopy-aarch64-simd-be-1-87-0"
          - crate: "zerocopy-derive"
            toolchain: "no-zerocopy-panic-in-const-and-vec-try-reserve-1-57-0"
          # The `no-zerocopy-aarch64-simd-1-59-0` toolchain only tests
          # `aarch64-unknown-linux-gnu`, which is skipped on `pull_request`
          # events and runs in the `cross` batch on full runs.
          - toolchain: "no-zerocopy-aarch64-simd-1-59-0"
            target: "i686-unknown-linux-gnu"
          - toolchain: "no-zerocopy-aarch64-simd-1-59-0"
            target: "x86_64-unknown-linux-gnu"
          - toolchain: "no-zerocopy-aarch64-simd-1-59-0"
            target: "cross"
            event_name: "pull_request"
          # The `no-zerocopy-aarch64-simd-be-1-87-0` toolchain only tests
          # `aarch64-unknown-linux-gnu`, which is skipped on `pull_request`
          # events and runs in the `cross` batch on full runs.
          - toolchain: "no-zerocopy-aarch64-simd-be-1-87-0"
            target: "i686-unknown-linux-gnu"
          - toolchain: "no-zerocopy-aarch64-simd-be-1-87-0"
            target: "x86_64-unknown-linux-gnu"
          - toolchain: "no-zerocopy-aarch64-simd-be-1-87-0"
            target: "cross"
            event_name: "pull_request"
          # Exclude cross targets from toolchains whose probed `build.rs`
          # feature is unrelated to compilation target, leaving only `i686` and
          # `x86_64`.
          - toolchain: "no-zerocopy-allocator-api-1-100-0"
            target: "cross"
          - toolchain: "no-zerocopy-core-error-1-81-0"
            target: "cross"
          - toolchain: "no-zerocopy-diagnostic-on-unimplemented-1-78-0"
            target: "cross"
          - toolchain: "no-zerocopy-generic-bounds-in-const-fn-1-61-0"
            target: "cross"

    name: Build & Test (${{ matrix.crate }} / ${{ matrix.toolchain }} / ${{ matrix.feature_profile }} / ${{ matrix.target }})

    steps:
    - &matrix_checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false

    # The producer exposes the ID assigned by upload-artifact, rather than an
    # artifact name. The ID identifies one immutable artifact from this exact
    # run, so a renamed, stale, or Buildx-generated artifact cannot be selected
    # accidentally. Checkout must remain first because this is a local action.
    # Bound each download step with `timeout-minutes` (composite steps cannot
    # set `timeout-minutes`) so a single stalled Azure Blob stream cannot hang
    # a large merge group for 25+ minutes without retrying on a fresh socket.
    - &download_ci_image_1
      name: Download prebuilt Docker image
      id: download_ci_image_1
      timeout-minutes: 4
      continue-on-error: true
      uses: ./.github/actions/download-artifact-with-retry
      with:
        artifact-id: ${{ needs.build_docker_env.outputs.image_artifact_id }}
        path: ${{ runner.temp }}
        expected-file: ${{ env.ZC_CI_IMAGE_ARCHIVE }}

    - &download_ci_image_2
      name: Download prebuilt Docker image (timeout retry)
      if: ${{ success() && steps.download_ci_image_1.outcome != 'success' }}
      timeout-minutes: 6
      uses: ./.github/actions/download-artifact-with-retry
      with:
        artifact-id: ${{ needs.build_docker_env.outputs.image_artifact_id }}
        path: ${{ runner.temp }}
        expected-file: ${{ env.ZC_CI_IMAGE_ARCHIVE }}

    # This step runs before /tmp/docker-shell.sh exists, so its explicit Bash
    # shell is load-bearing. The Docker exporter is single-platform; the
    # producer and every consumer intentionally use the same ubuntu-latest
    # runner architecture. If CI gains another architecture, build and select a
    # distinct artifact ID for it rather than silently sharing this archive.
    - &load_ci_image
      name: Load prebuilt Docker image
      shell: bash
      env:
        IMAGE_ARCHIVE: ${{ runner.temp }}/${{ env.ZC_CI_IMAGE_ARCHIVE }}
        IMAGE_NAME: ${{ env.ZC_CI_IMAGE }}
      run: |
        set -euo pipefail
        # Keep the large archive only as long as `docker load` needs it. The
        # trap also reclaims it if loading or validation fails, avoiding archive
        # plus expanded-image disk pressure for later diagnostic steps.
        trap 'rm -f -- "$IMAGE_ARCHIVE"' EXIT
        zstd -dc "$IMAGE_ARCHIVE" | docker load
        docker image inspect "$IMAGE_NAME" >/dev/null
        # `inspect` proves the tag exists; running a trivial command also proves
        # that the archive matches this runner's architecture.
        docker run --rm "$IMAGE_NAME" true

    - &create_docker_shell
      name: Create Docker Shell Wrapper
      shell: bash
      run: |
        set -eo pipefail

        # Keep the Docker steps' Cargo cache separate from the host Cargo home.
        # The container runs as root, while later host-side actions run as the
        # runner user and need to write their own Cargo registry cache.
        mkdir -p /home/runner/.docker-cargo/registry /home/runner/.docker-cargo/git

        cat << 'EOF' > /tmp/docker-shell.sh
        #!/bin/bash
        # Boot an ephemeral container for the step, mounting the workspace and
        # temp dirs. Explicitly forward GitHub Actions internal state and matrix
        # environment variables.
        docker run --rm -i \
          --workdir "$PWD" \
          -v /home/runner/work:/home/runner/work \
          -v /home/runner/.docker-cargo/registry:/root/.cargo/registry \
          -v /home/runner/.docker-cargo/git:/root/.cargo/git \
          -e GITHUB_ENV -e GITHUB_PATH -e GITHUB_STEP_SUMMARY -e GITHUB_OUTPUT -e GITHUB_WORKSPACE \
          -e CI -e GITHUB_ACTIONS -e GITHUB_ACTOR -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_REF -e GITHUB_EVENT_NAME \
          -e TOOLCHAIN -e CRATE -e TARGET -e CROSS_TARGETS -e FEATURE_PROFILE -e FEATURES -e ZC_TOOLCHAIN \
          -e RUSTFLAGS -e RUSTDOCFLAGS -e MIRIFLAGS -e MIRI_MODEL_FLAGS \
          -e CARGO_NET_RETRY -e RUSTUP_MAX_RETRIES \
          -e ZC_NIGHTLY_RUSTFLAGS -e ZC_NIGHTLY_MIRIFLAGS \
          -e ZC_SKIP_CARGO_SEMVER_CHECKS \
          "$ZC_CI_IMAGE" bash -c "git config --global --add safe.directory '*' && exec bash -e -o pipefail \"\$1\"" -- "$1"
        EOF
        chmod +x /tmp/docker-shell.sh

    - &configure_matrix_environment
      name: Configure environment variables
      env:
        TOOLCHAIN: ${{ matrix.toolchain }}
        FEATURE_PROFILE: ${{ matrix.feature_profile }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        MIRIFLAGS="${MIRIFLAGS:-}"

        case "$FEATURE_PROFILE" in
          default) FEATURES='' ;;
          stable)
            FEATURES='--no-default-features --features __internal_use_only_features_that_work_on_stable'
            ;;
          all) FEATURES='--all-features' ;;
          *) echo "unknown feature profile: $FEATURE_PROFILE" >&2; exit 1 ;;
        esac
        echo "FEATURES=$FEATURES" >> "$GITHUB_ENV"

        # When `TARGET` is `cross`, select the exact cross-compilation targets
        # for this `(toolchain, feature_profile, event_name)` cell. Fail closed
        # on excluded combinations so matrix-exclusion drift cannot silently
        # test the wrong target set.
        if [[ "$TARGET" == "cross" ]]; then
          case "$TOOLCHAIN" in
            no-zerocopy-aarch64-simd-1-59-0|no-zerocopy-aarch64-simd-be-1-87-0)
              if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
                echo "error: $TOOLCHAIN cross job should be excluded on pull_request" >&2
                exit 1
              fi
              CROSS_TARGETS="aarch64-unknown-linux-gnu"
              ;;
            no-zerocopy-allocator-api-1-100-0|no-zerocopy-core-error-1-81-0|no-zerocopy-diagnostic-on-unimplemented-1-78-0|no-zerocopy-generic-bounds-in-const-fn-1-61-0)
              echo "error: $TOOLCHAIN cross job should be excluded" >&2
              exit 1
              ;;
            *)
              if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
                # On PR events, only Windows cross-compilation runs; other cross
                # targets are checked in the merge queue.
                CROSS_TARGETS="x86_64-pc-windows-msvc"
              else
                CROSS_TARGETS="arm-unknown-linux-gnueabi aarch64-unknown-linux-gnu powerpc-unknown-linux-gnu powerpc64-unknown-linux-gnu riscv64gc-unknown-linux-gnu s390x-unknown-linux-gnu x86_64-pc-windows-msvc"
                # `thumbv6m-none-eabi` lacks a pre-compiled `std`, so only test
                # it with `default` features.
                if [[ "$FEATURE_PROFILE" == "default" ]]; then
                  CROSS_TARGETS="$CROSS_TARGETS thumbv6m-none-eabi"
                fi
                # `wasm32-unknown-unknown` is not installed via rustup on
                # `stable`.
                if [[ "$TOOLCHAIN" != "stable" ]]; then
                  CROSS_TARGETS="$CROSS_TARGETS wasm32-unknown-unknown"
                fi
              fi
              ;;
          esac
          echo "Cross targets: $CROSS_TARGETS" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "CROSS_TARGETS=$CROSS_TARGETS" >> "$GITHUB_ENV"
        fi

        # We use toolchain descriptors ("msrv", "stable", "nightly", and values
        # from the "metadata.build-rs" key in Cargo.toml) in the matrix. This
        # step converts the current descriptor to a particular toolchain version
        # by looking up the corresponding key in `Cargo.toml`. It sets the
        # `ZC_TOOLCHAIN` environment variable for use in the next step
        # (toolchain installation) because GitHub variable interpolation doesn't
        # support running arbitrary commands. In other words, we can't rewrite:
        #
        #   toolchain: $ {{ env.ZC_TOOLCHAIN }}
        #
        # ...to:
        #
        #   toolchain: $ {{ ./cargo.sh --version matrix.toolchain }} # hypothetical syntax
        ZC_TOOLCHAIN="$(./cargo.sh --version $TOOLCHAIN)"
        echo "Found that the '$TOOLCHAIN' toolchain is $ZC_TOOLCHAIN" | tee -a $GITHUB_STEP_SUMMARY
        echo "ZC_TOOLCHAIN=$ZC_TOOLCHAIN" >> $GITHUB_ENV

        if [[ "$TOOLCHAIN" == 'nightly' ]]; then
          RUSTFLAGS="$RUSTFLAGS $ZC_NIGHTLY_RUSTFLAGS"
          MIRIFLAGS="$MIRIFLAGS $ZC_NIGHTLY_MIRIFLAGS"
          echo "Using nightly toolchain; setting RUSTFLAGS='$RUSTFLAGS' and MIRIFLAGS='$MIRIFLAGS'" | tee -a $GITHUB_STEP_SUMMARY
          echo "RUSTFLAGS=$RUSTFLAGS" >> $GITHUB_ENV
          echo "MIRIFLAGS=$MIRIFLAGS" >> $GITHUB_ENV
        else
          echo "Using non-nightly toolchain; not modifying RUSTFLAGS='$RUSTFLAGS' or MIRIFLAGS='$MIRIFLAGS'" | tee -a $GITHUB_STEP_SUMMARY
        fi

    # Native targets run every test that Cargo selects by default in one pass.
    # Cargo skips the UI test without `derive` and runs the codegen test in its
    # dedicated CI job.
    - name: Test native target
      env:
        TOOLCHAIN: ${{ matrix.toolchain }}
        CRATE: ${{ matrix.crate }}
        TARGET: ${{ matrix.target }}
      run: |
        ./cargo.sh +$TOOLCHAIN test \
          --package $CRATE \
          --target $TARGET \
          $FEATURES \
          --verbose
      if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'i686-unknown-linux-gnu'

    # Cross targets cannot execute tests on this Linux x86_64 runner, so check
    # test-only code and build library code in separate passes. `memchr` in
    # thumb's dev-dependency graph prevents `cargo check --tests` on
    # `thumbv6m-none-eabi`, so check only the library for thumb.
    - name: Check cross targets
      if: matrix.target == 'cross'
      env:
        TOOLCHAIN: ${{ matrix.toolchain }}
        CRATE: ${{ matrix.crate }}
      run: |
        set -euo pipefail
        if [[ -z "${CROSS_TARGETS:-}" ]]; then
          echo "::error::CROSS_TARGETS is empty"
          exit 1
        fi
        failures=0
        for target in $CROSS_TARGETS; do
          echo "::group::Check $target"
          if [[ "$target" == "thumbv6m-none-eabi" ]]; then
            if ! ./cargo.sh +"$TOOLCHAIN" check \
              --package "$CRATE" --target "$target" ${FEATURES:-} --verbose; then
              echo "::error::cargo check failed for target $target"
              failures=1
            fi
          else
            if ! ./cargo.sh +"$TOOLCHAIN" check --tests \
              --package "$CRATE" --target "$target" ${FEATURES:-} --verbose; then
              echo "::error::cargo check --tests failed for target $target"
              failures=1
            elif ! ./cargo.sh +"$TOOLCHAIN" build \
              --package "$CRATE" --target "$target" ${FEATURES:-} --verbose; then
              echo "::error::cargo build failed for target $target"
              failures=1
            fi
          fi
          echo "::endgroup::"
        done
        exit "$failures"

    - name: Clippy tests
      env:
        TOOLCHAIN: ${{ matrix.toolchain }}
        CRATE: ${{ matrix.crate }}
        TARGET: ${{ matrix.target }}
      run: ./cargo.sh +$TOOLCHAIN clippy --package $CRATE --target $TARGET $FEATURES --tests --verbose
      # Clippy improves the accuracy of lints over time, and fixes bugs. Only
      # running Clippy on nightly allows us to avoid having to write code which
      # is compatible with older versions of Clippy, which sometimes requires
      # hacks to work around limitations that are fixed in more recent versions.
      if: matrix.toolchain == 'nightly' && matrix.target != 'cross'

    # On the `thumbv6m-none-eabi` target, we can't run `cargo clippy --tests`
    # due to the `memchr` crate, so we run `cargo clippy` instead.
    - name: Clippy cross targets
      if: matrix.toolchain == 'nightly' && matrix.target == 'cross'
      env:
        TOOLCHAIN: ${{ matrix.toolchain }}
        CRATE: ${{ matrix.crate }}
      run: |
        set -euo pipefail
        if [[ -z "${CROSS_TARGETS:-}" ]]; then
          echo "::error::CROSS_TARGETS is empty"
          exit 1
        fi
        failures=0
        for target in $CROSS_TARGETS; do
          echo "::group::Clippy $target"
          if [[ "$target" == "thumbv6m-none-eabi" ]]; then
            if ! ./cargo.sh +"$TOOLCHAIN" clippy \
              --package "$CRATE" --target "$target" ${FEATURES:-} --verbose; then
              echo "::error::cargo clippy failed for target $target"
              failures=1
            fi
          else
            if ! ./cargo.sh +"$TOOLCHAIN" clippy \
              --package "$CRATE" --target "$target" ${FEATURES:-} --tests --verbose; then
              echo "::error::cargo clippy --tests failed for target $target"
              failures=1
            fi
          fi
          echo "::endgroup::"
        done
        exit "$failures"

    - name: Cargo doc
      # `cargo doc` does not take `--target`, so run it once per
      # `(crate, toolchain, feature_profile)` instead of repeating it on every
      # target cell. The two aarch64-only toolchains exclude `x86_64`, so run
      # their doc build in the `cross` job.
      if: >-
        matrix.target == 'x86_64-unknown-linux-gnu' ||
        (matrix.target == 'cross' &&
          (matrix.toolchain == 'no-zerocopy-aarch64-simd-1-59-0' ||
            matrix.toolchain == 'no-zerocopy-aarch64-simd-be-1-87-0'))
      # We pass --document-private-items and --document-hidden items to ensure that 
      # documentation always builds even for these items. This makes future changes to 
      # make those items public/non-hidden more painless. Note that 
      # --document-hidden-items is unstable; if a future release breaks or removes it,
      # we can just update CI to no longer pass that flag.
      env:
        TOOLCHAIN: ${{ matrix.toolchain }}
        CRATE: ${{ matrix.crate }}
        NIGHTLY_FLAG: ${{ matrix.toolchain == 'nightly' && '-Z unstable-options --document-hidden-items $METADATA_DOCS_RS_RUSTDOC_ARGS'|| '' }}
      run: |
        # Include arguments passed during docs.rs deployments to make sure those
        # work properly.
        set -eo pipefail
        METADATA_DOCS_RS_RUSTDOC_ARGS="$(env -u RUSTFLAGS -u RUSTDOCFLAGS ./cargo.sh +stable metadata --manifest-path Cargo.toml --no-deps --format-version 1 | \
          jq -r ".packages[] | select(.name == \"zerocopy\").metadata.docs.rs.\"rustdoc-args\"[]" | tr '\n' ' ')"
        if [[ "$TOOLCHAIN" == "nightly" ]]; then
          export RUSTDOCFLAGS="-Z unstable-options --document-hidden-items $METADATA_DOCS_RS_RUSTDOC_ARGS $RUSTDOCFLAGS"
        fi
        ./cargo.sh +$TOOLCHAIN doc --no-deps --document-private-items --package $CRATE $FEATURES

    # If the commit message contains the line `SKIP_CARGO_SEMVER_CHECKS=1`, then
    # skip the cargo-semver-checks step.
    - name: Check whether to skip cargo-semver-checks
      if: >-
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable'
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        SHA: ${{ github.sha }}
      run: |
        set -eo pipefail

        if [ "$EVENT_NAME" == "pull_request" ]; then
          # Invoked from a PR - get the PR body directly
          MESSAGE="$(git log -1 --pretty=%B $HEAD_SHA)"
        else
          # Invoked from the merge queue - get the commit message
          MESSAGE="$(git log -1 --pretty=%B $SHA)"
        fi

        if echo "$MESSAGE" | grep '^\s*SKIP_CARGO_SEMVER_CHECKS=1\s*$' > /dev/null; then
          echo "Found 'SKIP_CARGO_SEMVER_CHECKS=1' in commit message; skipping cargo-semver-checks..." | tee -a $GITHUB_STEP_SUMMARY
          echo "ZC_SKIP_CARGO_SEMVER_CHECKS=1" >> $GITHUB_ENV
        fi

    # FIXME(#2906): We do this because `cargo semver-checks` fetches the latest
    # zerocopy from crates.io, but `.cargo/config.toml` causes that to resolve
    # in our vendor directory, and we don't vendor zerocopy. Removing this file
    # has the effect of causing the subsequent build to use crates.io rather
    # than vendored dependencies, which is fine since we only run this on the
    # stable toolchain. Eventually, we should update this job to use the
    # `--baseline-rev` option to use a previous git commit as the baseline for
    # checking compatibility (rather than the most recent published version),
    # which will make it unnecessary to remove `.cargo/config.toml`.
    - name: Remove Cargo config and vendored dependencies
      if: >-
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable' &&
        env.ZC_SKIP_CARGO_SEMVER_CHECKS != '1'
      run: rm -rf .cargo/config.toml

    # Check semver compatibility with the most recently-published version on
    # crates.io. We do this in the matrix rather than in its own job so that it
    # gets run on different targets. Some of our API is target-specific (e.g.,
    # SIMD type impls), and so we need to run on each target.
    - name: Check semver compatibility
      uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
      env:
        # `zerocopy_unstable_ptr` exposes unstable API, so it should not be
        # included in semver checks.
        RUSTDOCFLAGS: -Dwarnings
      with:
        # Don't semver check zerocopy-derive; as a proc macro, it doesn't have
        # an API that cargo-semver-checks can understand.
        package: zerocopy
        # Test on the stable toolchain, and thus don't test nightly features.
        # We previously tested on the nightly toolchain, but this caused problems
        # [1] because cargo-semver-checks only promises compatibility with the
        # latest stable toolchain. Testing on the stable toolchain is more
        # reliable, and doesn't require us to give up anything - we wouldn't want
        # to test nightly-only features anyway, as we don't make stability
        # guarantees regarding these features.
        # 
        # [1] See, for example: https://github.com/google/zerocopy/actions/runs/9466417300/job/26078264384?pr=1413
        feature-group: only-explicit-features
        features: __internal_use_only_features_that_work_on_stable
        manifest-path: zerocopy/Cargo.toml
        prefix-key: semver-${{ matrix.target }}
        rust-toolchain: ${{ env.ZC_TOOLCHAIN }}
        rust-target: ${{ matrix.target }}
      if: |
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable' &&
        matrix.target != 'cross' &&
        env.ZC_SKIP_CARGO_SEMVER_CHECKS != '1'

    # In the batched `cross` job, check semver compatibility for each cross
    # target that builds on `stable` (`x86_64-pc-windows-msvc` on all events,
    # plus the six Linux cross targets on full runs). The pinned action saves
    # `semver-checks/target/semver-checks/cache` at the end of `main` (no
    # `post` step), so give each target a distinct `prefix-key` and clear
    # `semver-checks/target/{semver-checks,doc}` between targets to prevent
    # on-disk baseline contamination or cache accumulation across targets.
    # TODO(#1565): Run on wasm32-unknown-unknown.
    - name: Check semver compatibility (x86_64-pc-windows-msvc)
      uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
      env:
        RUSTDOCFLAGS: -Dwarnings
      with:
        package: zerocopy
        feature-group: only-explicit-features
        features: __internal_use_only_features_that_work_on_stable
        manifest-path: zerocopy/Cargo.toml
        prefix-key: semver-x86_64-pc-windows-msvc
        rust-toolchain: ${{ env.ZC_TOOLCHAIN }}
        rust-target: x86_64-pc-windows-msvc
      if: |
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable' &&
        matrix.target == 'cross' &&
        env.ZC_SKIP_CARGO_SEMVER_CHECKS != '1'

    - &reset_semver_cache
      name: Reset semver rustdoc cache
      if: |
        github.event_name != 'pull_request' &&
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable' &&
        matrix.target == 'cross' &&
        env.ZC_SKIP_CARGO_SEMVER_CHECKS != '1'
      shell: bash
      working-directory: .
      run: rm -rf semver-checks/target/semver-checks semver-checks/target/doc

    - name: Check semver compatibility (arm-unknown-linux-gnueabi)
      uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
      env:
        RUSTDOCFLAGS: -Dwarnings
      with:
        package: zerocopy
        feature-group: only-explicit-features
        features: __internal_use_only_features_that_work_on_stable
        manifest-path: zerocopy/Cargo.toml
        prefix-key: semver-arm-unknown-linux-gnueabi
        rust-toolchain: ${{ env.ZC_TOOLCHAIN }}
        rust-target: arm-unknown-linux-gnueabi
      if: |
        github.event_name != 'pull_request' &&
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable' &&
        matrix.target == 'cross' &&
        env.ZC_SKIP_CARGO_SEMVER_CHECKS != '1'

    - *reset_semver_cache

    - name: Check semver compatibility (aarch64-unknown-linux-gnu)
      uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
      env:
        RUSTDOCFLAGS: -Dwarnings
      with:
        package: zerocopy
        feature-group: only-explicit-features
        features: __internal_use_only_features_that_work_on_stable
        manifest-path: zerocopy/Cargo.toml
        prefix-key: semver-aarch64-unknown-linux-gnu
        rust-toolchain: ${{ env.ZC_TOOLCHAIN }}
        rust-target: aarch64-unknown-linux-gnu
      if: |
        github.event_name != 'pull_request' &&
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable' &&
        matrix.target == 'cross' &&
        env.ZC_SKIP_CARGO_SEMVER_CHECKS != '1'

    - *reset_semver_cache

    - name: Check semver compatibility (powerpc-unknown-linux-gnu)
      uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
      env:
        RUSTDOCFLAGS: -Dwarnings
      with:
        package: zerocopy
        feature-group: only-explicit-features
        features: __internal_use_only_features_that_work_on_stable
        manifest-path: zerocopy/Cargo.toml
        prefix-key: semver-powerpc-unknown-linux-gnu
        rust-toolchain: ${{ env.ZC_TOOLCHAIN }}
        rust-target: powerpc-unknown-linux-gnu
      if: |
        github.event_name != 'pull_request' &&
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable' &&
        matrix.target == 'cross' &&
        env.ZC_SKIP_CARGO_SEMVER_CHECKS != '1'

    - *reset_semver_cache

    - name: Check semver compatibility (powerpc64-unknown-linux-gnu)
      uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
      env:
        RUSTDOCFLAGS: -Dwarnings
      with:
        package: zerocopy
        feature-group: only-explicit-features
        features: __internal_use_only_features_that_work_on_stable
        manifest-path: zerocopy/Cargo.toml
        prefix-key: semver-powerpc64-unknown-linux-gnu
        rust-toolchain: ${{ env.ZC_TOOLCHAIN }}
        rust-target: powerpc64-unknown-linux-gnu
      if: |
        github.event_name != 'pull_request' &&
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable' &&
        matrix.target == 'cross' &&
        env.ZC_SKIP_CARGO_SEMVER_CHECKS != '1'

    - *reset_semver_cache

    - name: Check semver compatibility (riscv64gc-unknown-linux-gnu)
      uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
      env:
        RUSTDOCFLAGS: -Dwarnings
      with:
        package: zerocopy
        feature-group: only-explicit-features
        features: __internal_use_only_features_that_work_on_stable
        manifest-path: zerocopy/Cargo.toml
        prefix-key: semver-riscv64gc-unknown-linux-gnu
        rust-toolchain: ${{ env.ZC_TOOLCHAIN }}
        rust-target: riscv64gc-unknown-linux-gnu
      if: |
        github.event_name != 'pull_request' &&
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable' &&
        matrix.target == 'cross' &&
        env.ZC_SKIP_CARGO_SEMVER_CHECKS != '1'

    - *reset_semver_cache

    - name: Check semver compatibility (s390x-unknown-linux-gnu)
      uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
      env:
        RUSTDOCFLAGS: -Dwarnings
      with:
        package: zerocopy
        feature-group: only-explicit-features
        features: __internal_use_only_features_that_work_on_stable
        manifest-path: zerocopy/Cargo.toml
        prefix-key: semver-s390x-unknown-linux-gnu
        rust-toolchain: ${{ env.ZC_TOOLCHAIN }}
        rust-target: s390x-unknown-linux-gnu
      if: |
        github.event_name != 'pull_request' &&
        matrix.crate == 'zerocopy' &&
        matrix.feature_profile == 'stable' &&
        matrix.toolchain == 'stable' &&
        matrix.target == 'cross' &&
        env.ZC_SKIP_CARGO_SEMVER_CHECKS != '1'

  # Miri runs only on full events because it is much more expensive than the
  # ordinary build matrix. Each borrow model is its own matrix cell so the two
  # models and all eligible target/profile combinations can run concurrently.
  miri:
    if: github.event_name != 'pull_request' && needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [detect_changes, build_docker_env]
    permissions:
      contents: read
    defaults:
      run:
        shell: /tmp/docker-shell.sh {0} # zizmor: ignore[misfeature] (CI intentionally routes Miri through the prebuilt Docker image)
        working-directory: zerocopy
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["nightly"]
        # List supported Miri targets explicitly (omitting
        # `riscv64gc-unknown-linux-gnu`, `thumbv6m-none-eabi`, and
        # `wasm32-unknown-unknown`, which Miri does not currently run here).
        target: [
          "i686-unknown-linux-gnu",
          "x86_64-unknown-linux-gnu",
          "arm-unknown-linux-gnueabi",
          "aarch64-unknown-linux-gnu",
          "powerpc-unknown-linux-gnu",
          "powerpc64-unknown-linux-gnu",
          "s390x-unknown-linux-gnu",
          "x86_64-pc-windows-msvc"
        ]
        feature_profile: *feature_profiles
        crate: *build_crates
        miri_model:
          - name: stacked
            flags: ""
          - name: tree
            flags: "-Zmiri-tree-borrows"
        exclude:
          # zerocopy-derive has no package-local feature profiles.
          - crate: "zerocopy-derive"
            feature_profile: "stable"
          - crate: "zerocopy-derive"
            feature_profile: "all"

    name: Miri (${{ matrix.crate }} / ${{ matrix.feature_profile }} / ${{ matrix.miri_model.name }} / ${{ matrix.target }})

    steps:
    - *matrix_checkout
    - *download_ci_image_1
    - *download_ci_image_2
    - *load_ci_image
    - *create_docker_shell
    - *configure_matrix_environment

    - name: Run tests under Miri
      env:
        TARGET: ${{ matrix.target }}
        TOOLCHAIN: ${{ matrix.toolchain }}
        CRATE: ${{ matrix.crate }}
        MIRI_MODEL_FLAGS: ${{ matrix.miri_model.flags }}
      run: |
        set -euo pipefail

        # FIXME(#2906): Miri builds std from source, whose dependencies are not
        # included in the vendored Cargo source. Temporarily bypass vendoring
        # and restore the configuration on every exit path.
        mv .cargo/config.toml .cargo/config.toml.bak
        trap 'mv .cargo/config.toml.bak .cargo/config.toml' EXIT

        # Work around https://github.com/rust-lang/miri/issues/3125.
        [ "$TARGET" == "aarch64-unknown-linux-gnu" ] && cargo clean

        # Batch Miri tests across `nproc` concurrent `cargo-miri runner`
        # processes instead of spawning one Miri interpreter per test via
        # `nextest run`, avoiding per-test interpreter startup overhead while
        # executing the exact same test set.
        MIRIFLAGS="${MIRIFLAGS:-} ${MIRI_MODEL_FLAGS:-}" ../.github/scripts/run_miri_batched.sh \
          --toolchain "$TOOLCHAIN" \
          --package "$CRATE" \
          --target "$TARGET" \
          -- ${FEATURES:-}

  codegen:
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    name: Run codegen tests
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          set -eo pipefail
          sudo apt install -qq llvm
          # Snapshot generation calls this same helper, so generation and
          # validation cannot silently select different tool releases.
          bash ../tools/install-cargo-show-asm.sh

      - name: Clippy
        run: |
          ./cargo.sh +nightly clippy --locked \
            --package zerocopy \
            --target x86_64-unknown-linux-gnu \
            --all-features \
            --test codegen \
            --verbose \
            -- -Dwarnings

      - name: Run tests
        run: |
          RUSTFLAGS="$RUSTFLAGS -Awarnings" ./cargo.sh +nightly test --locked \
            --package zerocopy \
            --target x86_64-unknown-linux-gnu \
            --all-features \
            --verbose \
            --test codegen

  coverage:
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    name: Generate code coverage
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate code coverage
        run: |
          set -eo pipefail
          ./cargo.sh +nightly install --version 0.8.0 cargo-llvm-cov
          ./cargo.sh +nightly llvm-cov \
            --package zerocopy \
            --target x86_64-unknown-linux-gnu \
            --all-features \
            --doctests \
            --lcov \
            --output-path lcov.info \
            --verbose
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          files: zerocopy/lcov.info

  kani:
    # Pin to ubuntu-24.04: ubuntu-26.04 ships with GCC 15, whose stddef.h
    # includes C23 `nullptr_t`, which breaks CBMC's goto-cc in Kani 0.60.0.
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-24.04
    name: 'Run tests under Kani (${{ matrix.configuration }})'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Kani sets cfg(kani) in dependencies even without their features.
          - configuration: no features
            args: '--no-default-features --only-codegen'
            shard: '1/1'
          - configuration: 'stable features, shard 1/2'
            args: '--features __internal_use_only_features_that_work_on_stable'
            shard: '1/2'
          - configuration: 'stable features, shard 2/2'
            args: '--features __internal_use_only_features_that_work_on_stable'
            shard: '2/2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        env:
          KANI_SHARD: ${{ matrix.shard }}
        with:
          command: ./.github/scripts/run_kani_sharded.sh
          # Use `--features __internal_use_only_features_that_work_on_stable`
          # because the Kani GitHub Action uses its own pinned nightly
          # toolchain. Sometimes, we make changes to our nightly features for
          # more recent toolchains, and so our nightly features become
          # incompatible with the toolchain that Kani uses. By only testing
          # stable features, we ensure that this doesn't cause problems in CI.
          #
          # TODO(https://github.com/model-checking/kani-github-action/issues/56):
          # Go back to testing all features once the Kani GitHub Action supports
          # specifying a particular toolchain.
          args: "--manifest-path zerocopy/Cargo.toml --package zerocopy ${{ matrix.args }} --output-format=terse -Zunstable-options -j -Zfunction-contracts --randomize-layout --memory-safety-checks --overflow-checks --undefined-function-checks --unwinding-checks"
          # This version is automatically rolled by
          # `roll-pinned-toolchain-versions.yml`.
          kani-version: 0.60.0

  # NEON intrinsics are currently broken on big-endian platforms. [1] This test ensures
  # that we don't accidentally attempt to compile these intrinsics on such platforms. We
  # can't use this as part of the build matrix because rustup doesn't support the
  # `aarch64_be-unknown-linux-gnu` target.
  #
  # [1] https://github.com/rust-lang/stdarch/issues/1484
  check_be_aarch64:
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    name: Build (zerocopy / nightly / --simd / aarch64_be-unknown-linux-gnu)
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure environment variables
        run: |
          set -eo pipefail
          RUSTFLAGS="$RUSTFLAGS $ZC_NIGHTLY_RUSTFLAGS"
          echo "RUSTFLAGS=$RUSTFLAGS" >> $GITHUB_ENV
      - name: Check big endian for aarch64_be-unknown-linux-gnu target
        run: |
          set -eo pipefail

          # FIXME(#2906): We do this because `cargo vendor` doesn't currently
          # support vendoring std's dependencies (required in order to build
          # std from source, as we do here). As a workaround, we simply nuke
          # the cargo config and bypass vendoring altogether. Eventually, we
          # should get vendoring working for std's dependencies too.
          #
          # See also: https://github.com/rust-lang/wg-cargo-std-aware/issues/23
          rm .cargo/config.toml

          ./cargo.sh +nightly build --target=aarch64_be-unknown-linux-gnu -Zbuild-std --features simd

  # We can't use this as part of the build matrix because rustup doesn't support
  # the `avr-none` target.
  check_avr_atmega:
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    name: Build (zerocopy / nightly / --simd / avr-none)
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure environment variables
        run: |
          set -eo pipefail
          RUSTFLAGS="$RUSTFLAGS $ZC_NIGHTLY_RUSTFLAGS"
          echo "RUSTFLAGS=$RUSTFLAGS" >> $GITHUB_ENV
      # FIXME(#2906): We do this because `cargo vendor` doesn't currently
      # support vendoring std's dependencies (required in order to build std
      # from source, as we do here). As a workaround, we simply nuke the cargo
      # config and bypass vendoring altogether. Eventually, we should get
      # vendoring working for std's dependencies too.
      #
      # See also: https://github.com/rust-lang/wg-cargo-std-aware/issues/23
      - name: Remove Cargo config
        run: rm .cargo/config.toml
      # NOTE: We cannot check tests because of a number of different issues (at
      # the time of writing):
      # - No `alloc::sync`
      # - Values of type `[u8; 32768]` are too big
      #
      # To try for yourself, replace `-Zbuild-std=core` with `-Zbuild-std` and
      # add `--tests`.
      - name: Check avr-none target
        run: RUSTFLAGS='-C target-cpu=atmega328p' ./cargo.sh +nightly check --target=avr-none -Zbuild-std=core --features simd,simd-nightly,float-nightly,derive
      - name: Clippy check avr-none target
        run: RUSTFLAGS='-C target-cpu=atmega328p' ./cargo.sh +nightly clippy --target=avr-none -Zbuild-std=core --features simd,simd-nightly,float-nightly,derive

  check_fmt:
    runs-on: ubuntu-latest
    name: Check Rust formatting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Rust formatting
        run: ./ci/check_fmt.sh

  check_stale_stderr:
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    name: Check stale stderr files
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check stale stderr
        run: ./ci/check_stale_stderr.sh

  check_actions:
    runs-on: ubuntu-latest
    name: Check GitHub Actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Actions
        run: ./ci/check_actions.sh

  check_readme:
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    name: Check README.md
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check README.md
        run: ./ci/check_readme.sh

  check_versions:
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    name: Check crate versions match
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Make sure that both crates are at the same version, and that zerocopy
      # depends exactly upon the current version of zerocopy-derive. See
      # `INTERNAL.md` for an explanation of why we do this.
      - name: Check crate versions match
        run: ./ci/check_versions.sh

  check_packaging:
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    name: Check packaging
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check packaging
        run: ./ci/check_packaging.sh

  check_msrv_is_minimal:
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    name: Check MSRV is minimal
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check MSRV is minimal
        run: ./ci/check_msrv_is_minimal.sh

  check-all-toolchains-tested:
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    name: Check that all toolchains listed in Cargo.toml are tested in CI
    steps:
      - name: Install yq (for YAML parsing)
        # FIXME(https://github.com/mikefarah/yq/issues/2587): Remove
        # `GONOSUMDB` once this bug is fixed.
        run: GONOSUMDB=github.com/mikefarah/yq/v4 go install github.com/mikefarah/yq/v4@v4.44.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run check
        run: cd zerocopy && ./ci/check_all_toolchains_tested.sh

  check-job-dependencies:
    runs-on: ubuntu-latest
    name: Check all-jobs-succeeded depends on all jobs
    steps:
      - name: Install yq (for YAML parsing)
        # FIXME(https://github.com/mikefarah/yq/issues/2587): Remove
        # `GONOSUMDB` once this bug is fixed.
        run: GONOSUMDB=github.com/mikefarah/yq/v4 go install github.com/mikefarah/yq/v4@v4.44.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run dependency check
        run: ./ci/check_job_dependencies.sh

  check-todo:
    runs-on: ubuntu-latest
    name: Check for todo comments
    steps:
      - name: Install ripgrep
        run: |
         sudo apt-get update
         sudo apt-get install ripgrep
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run todo check
        run: ./ci/check_todo.sh

  test-tools:
    runs-on: ubuntu-latest
    name: Test Python tools
    # Strip Actions cache/artifact tokens when executing scripts in `tools/`.
    env:
      ACTIONS_CACHE_URL: ''
      ACTIONS_RESULTS_URL: ''
      ACTIONS_RUNTIME_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run tool unit tests
        run: python3 -B -m unittest discover -s tools -p 'test_*.py' -v

  check-skills:
    runs-on: ubuntu-latest
    name: Check agent skills and provenance lock
    permissions:
      contents: read
    env:
      ACTIONS_CACHE_URL: ''
      ACTIONS_RESULTS_URL: ''
      ACTIONS_RUNTIME_TOKEN: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify skills and provenance lockfile
        run: python3 -I -B ci/check_skills.py
      - name: Run skill checker unit tests
        run: python3 -I -B -m unittest discover -s ci -p 'test_*.py' -v

  run-git-hooks:
    runs-on: ubuntu-latest
    name: Run Git hooks
    env:
      ACTIONS_CACHE_URL: ''
      ACTIONS_RESULTS_URL: ''
      ACTIONS_RUNTIME_TOKEN: ''
    steps:
      - name: Install yq (for YAML parsing)
        # FIXME(https://github.com/mikefarah/yq/issues/2587): Remove
        # `GONOSUMDB` once this bug is fixed.
        run: GONOSUMDB=github.com/mikefarah/yq/v4 go install github.com/mikefarah/yq/v4@v4.44.1
      - name: Install ripgrep
        run: |
         sudo apt-get update
         sudo apt-get install ripgrep
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run dependency check
        # Ensure that Git hooks execute successfully.
        #
        # Note that this runs all hooks. As of this writing, the only Git hook
        # is `pre-push`. Running all hooks ensures that, if a new hook is added
        # which can't run in CI (at least not using this naive setup), we'll
        # notice and it will remind us to update this test.
        run: |
          set -eo pipefail
          for hook in ./githooks/*; do $hook; done

  zizmor:
    runs-on: ubuntu-latest
    name: zizmor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # Only scan the .github directory to avoid scanning vendored dependencies
          inputs: .github
          persona: pedantic
          # Avoid failing CI on low-severity findings from token-backed online audits;
          # those still show up in the non-blocking SARIF upload workflow.
          min-severity: medium
          # We don't want to use GitHub Advanced Security because we want to
          # block the merge on zizmor failure, and the only way to do that
          # (without manually configuring a ruleset) is to fail the job, which
          # the action only does if advanced-security is false.
          advanced-security: false

  build_docker_env:
    name: Build Docker image
    needs: detect_changes
    if: needs.detect_changes.outputs.run_zerocopy == 'true'
    runs-on: ubuntu-latest
    # Consumers select the upload by this immutable, producer-generated ID.
    # Do not replace it with a duplicated artifact-name string: an empty ID is
    # deliberately rejected by download-artifact-with-retry before fan-out.
    outputs:
      image_artifact_id: ${{ steps.upload_image.outputs.artifact-id }}
    permissions:
      contents: read
      packages: write # required to push docker caches to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: ./.github/actions/setup-docker-with-retry
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sanitized Docker tag
        id: docker_tag
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build, cache, and export image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .github/workflows/Dockerfile
          tags: ${{ env.ZC_CI_IMAGE }}
          provenance: false
          # Export an uncompressed Docker tar and compress it once with
          # multi-threaded zstd below. This avoids single-threaded gzip
          # decompression inside `docker load` across every matrix runner while
          # keeping the uploaded artifact suitable for upload-file-artifact's
          # direct (non-ZIP) transfer.
          outputs: type=docker,dest=${{ runner.temp }}/zerocopy-ci.tar,compression=uncompressed,force-compression=true
          # Merge-group refs (`gh-readonly-queue/main/...`) are single-use, so
          # probing an ephemeral tag for them always misses; read `:main` only.
          cache-from: |
            ${{ github.event_name != 'merge_group' && format('type=registry,ref=ghcr.io/google/zerocopy/zerocopy-ci-cache:{0}', steps.docker_tag.outputs.tag) || '' }}
            type=registry,ref=ghcr.io/google/zerocopy/zerocopy-ci-cache:main
          # External pull requests have read-only package permissions, and
          # merge-group refs are single-use (never read by future runs), so only
          # export GHCR cache layers on main pushes, same-repo PRs, and manual
          # dispatches.
          cache-to: ${{ github.event_name != 'merge_group' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('type=registry,ref=ghcr.io/google/zerocopy/zerocopy-ci-cache:{0},mode=max', steps.docker_tag.outputs.tag) || '' }}

      - name: Compress Docker image archive
        env:
          RAW_ARCHIVE: ${{ runner.temp }}/zerocopy-ci.tar
          COMPRESSED_ARCHIVE: ${{ runner.temp }}/${{ env.ZC_CI_IMAGE_ARCHIVE }}
        run: |
          set -euo pipefail
          trap 'rm -f -- "$RAW_ARCHIVE"' EXIT
          zstd -T0 -3 "$RAW_ARCHIVE" -o "$COMPRESSED_ARCHIVE"

      # Uploading is the producer's final gate. Matrix jobs cannot start until
      # this succeeds and the job exposes its artifact ID, so no runner is spent
      # on an image that was only partially published.
      - name: Upload image for matrix jobs
        id: upload_image
        uses: ./.github/actions/upload-file-artifact
        with:
          name: ${{ env.ZC_CI_IMAGE_ARCHIVE }}
          path: ${{ runner.temp }}/${{ env.ZC_CI_IMAGE_ARCHIVE }}

  # Used to signal to branch protections that all other jobs have succeeded.
  all-jobs-succeed:
      # WARNING: This name is load-bearing! It's how GitHub's settings UI configures which jobs
      # to block on. DO NOT change this name without updating the settings UI to match.
      name: All checks succeeded (ci.yml)
      # Run even when a dependency fails, is skipped, or is cancelled, then
      # inspect every result explicitly. A skipped required check counts as
      # success in branch protection, so this aggregation must fail closed.
      if: ${{ always() }}
      runs-on: ubuntu-latest
      needs: [detect_changes, build_test, miri, codegen, coverage, kani, check_be_aarch64, check_avr_atmega, check_fmt, check_actions, check_readme, check_versions, check_packaging, check_msrv_is_minimal, check_stale_stderr, check-all-toolchains-tested, check-job-dependencies, check-todo, test-tools, check-skills, run-git-hooks, zizmor, build_docker_env]
      steps:
        - name: Reject workflow cancellation
          if: ${{ cancelled() }}
          run: exit 1

        - name: Require every dependency to succeed
          env:
            EVENT_NAME: ${{ github.event_name }}
            RUN_ZEROCOPY: ${{ needs.detect_changes.outputs.run_zerocopy }}
            NEEDS_JSON: ${{ toJSON(needs) }}
          run: |
            set -euo pipefail
            jq -e --arg event "$EVENT_NAME" --arg run_zc "$RUN_ZEROCOPY" '
              type == "object" and length > 0 and
              ($event == "pull_request" or $run_zc == "true") and
              if $run_zc == "true" then
                all(
                  to_entries[];
                  if .key == "miri" and $event == "pull_request"
                  then .value.result == "skipped"
                  else .value.result == "success"
                  end
                )
              elif $run_zc == "false" then
                .detect_changes.result == "success" and
                all(
                  to_entries[];
                  if (.key | IN("detect_changes", "check_fmt", "check_actions", "check-job-dependencies", "check-todo", "test-tools", "check-skills", "run-git-hooks", "zizmor"))
                  then .value.result == "success"
                  else .value.result == "skipped"
                  end
                )
              else
                false
              end
            ' <<< "$NEEDS_JSON"
