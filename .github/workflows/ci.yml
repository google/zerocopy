name: Build & Tests

# Quote this key so YAML 1.1 parsers do not interpret it as a boolean.
'on':
  push:
    branches:
      - main
  pull_request:
  merge_group:
  # Useful for manually testing changes to this workflow. The typed planner
  # classifies this as a full event, so its plan enables all ordinary CI work,
  # including Miri.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job and action inherits this mapping. The exact keys and values are a
# source-level contract with `planned_adapter/planner.rs`; adding even a
# seemingly unrelated variable can change Cargo, rustup, the compiler, or a
# third-party action. Coordinate every change with that complete typed audit.
env:
  CARGO_TERM_COLOR: always
  # These are bounded, client-native retries for recognized transient download
  # failures. They never rerun a Cargo or rustup command, so deterministic build
  # and test failures still fail immediately. Keep these values coordinated
  # with `.github/workflows/anneal.yml` and the CI Dockerfile.
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # These two values are the producer/consumer protocol for the matrix's CI
  # image. `build_docker_env` must export this tag into this archive, each
  # consumer must load that archive, and the Docker shell wrapper must run this
  # tag. Keep the protocol centralized here rather than duplicating literals in
  # the upload/download actions.
  ZC_CI_IMAGE: zerocopy-ci:local
  ZC_CI_IMAGE_ARCHIVE: zerocopy-ci.tar
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings --cfg=zerocopy_unstable_ptr
  # `ZC_NIGHTLY_XXX` are flags that we add to `XXX` only on the nightly
  # toolchain.
  ZC_NIGHTLY_RUSTFLAGS: -Zrandomize-layout
  ZC_NIGHTLY_MIRIFLAGS: "-Zmiri-strict-provenance -Zmiri-backtrace=full"
  CARGO_ZEROCOPY_AUTO_INSTALL_TOOLCHAIN: 1

jobs:
  # Build the typed plan in parallel with the Docker image. This job is
  # deliberately unprivileged: it may select ordinary test work, but runner,
  # action, permission, and command authority remain in this workflow.
  #
  # The ordinary build, Miri, and semver jobs consume these matrices directly.
  # The jobs consume only checked selectors from each matrix cell. The typed
  # executors reconstruct ordinary build and Miri commands without interpreting
  # matrix data as shell text; the separately audited semver adapter accepts
  # only its target selector. Keep the output names coordinated with
  # `tools/zc/src/workflow_protocol.rs`, the three `fromJSON` expressions below,
  # and both optional-job eligibility consumers below.
  # The producer fields are checked by the planned-job workflow audit in
  # `tools/zc/src/planned_adapter/planner.rs`.
  plan_ci:
    name: Plan CI work
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      build_matrix: ${{ steps.plan.outputs.build_matrix }}
      miri_matrix: ${{ steps.plan.outputs.miri_matrix }}
      miri_enabled: ${{ steps.plan.outputs.miri_enabled }}
      semver_matrix: ${{ steps.plan.outputs.semver_matrix }}
      # These gates are derived from their projected matrices, not independently
      # from the event name. Keep them coordinated with `workflow_protocol.rs`,
      # the optional job conditions, and the required-check aggregation.
      semver_enabled: ${{ steps.plan.outputs.semver_enabled }}
    env:
      # upload-file-artifact requires its name to equal the path basename.
      # Keep this one value coordinated with the planner invocation and upload
      # below rather than repeating a load-bearing artifact name.
      CI_PLAN_ARTIFACT: ci-plan.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs and project the plan
        id: plan
        # The absolute custom shell removes Bash startup-control variables and
        # enables privileged mode so inherited startup files, shell options,
        # and exported functions cannot turn this step into a successful no-op.
        # The planner audit checks this exact shell template.
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -p -euo pipefail -- {0}
        working-directory: zerocopy
        env:
          EVENT_NAME: ${{ github.event_name }}
        # The runner applies GITHUB_PATH after merging step env, so assign the
        # fixed path directly to the child command. Do not rely on cargo.sh's
        # /usr/bin/env bash shebang. Privileged mode also prevents an imported
        # function from replacing a builtin when this child Bash starts. The
        # planner audit checks the run block line-for-line.
        run: |
          set -euo pipefail
          PATH=/home/runner/.cargo/bin:/usr/local/bin:/usr/bin:/bin \
          /bin/bash --noprofile --norc -p ./cargo.sh ci github-plan \
            --event "$EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT" \
            --artifact "$RUNNER_TEMP/$CI_PLAN_ARTIFACT"

      - name: Upload detailed plan for review
        uses: ./.github/actions/upload-file-artifact
        with:
          name: ${{ env.CI_PLAN_ARTIFACT }}
          path: ${{ runner.temp }}/${{ env.CI_PLAN_ARTIFACT }}
          # This JSON is small and intended for PR review, unlike the large
          # one-day fan-out archives used only by jobs in the same run.
          retention-days: 14

  build_test:
    runs-on: ubuntu-latest
    # We pre-compute a Docker image containing most dependencies. Each job in
    # the matrix runs in parallel, so without this pre-computation, most jobs
    # would duplicate the work of downloading crates from the internet.
    # Pre-computing ensures that this work only happens once.
    needs: [build_docker_env, plan_ci]
    permissions:
      contents: read

    strategy:
      # By default, this is set to `true`, which means that a single CI job
      # failure will cause all outstanding jobs to be canceled. This slows down
      # development because it means that errors need to be encountered and
      # fixed one at a time. The matrix audit also rejects `max-parallel` so
      # this fan-out cannot be silently serialized.
      fail-fast: false
      # `plan_ci` emits a complete `include` object, including an empty one if
      # no cells are selected. Do not add handwritten axes or exclusions here:
      # coverage belongs to `ci/zc.toml`, and the typed executor rejects any
      # selector which is not present in the checked plan for this event.
      matrix: ${{ fromJSON(needs.plan_ci.outputs.build_matrix) }}

    name: Build & Test (${{ matrix.crate }} / ${{ matrix.toolchain }} / ${{ matrix.feature_profile }} / ${{ matrix.target }})

    steps:
    # This defines the checkout step shared with Miri below. The planned-matrix
    # audit checks its complete significant source and both aliases. Keep the
    # anchor, action identity, and inputs coordinated with
    # `tools/zc/src/planned_adapter/matrix.rs`.
    - &matrix_checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # The producer exposes the ID assigned by upload-artifact, rather than an
    # artifact name. The ID identifies one immutable artifact from this exact
    # run, so a renamed, stale, or Buildx-generated artifact cannot be selected
    # accidentally. Checkout must remain first because this is a local action.
    - &download_ci_image
      name: Download prebuilt Docker image
      uses: ./.github/actions/download-artifact-with-retry
      with:
        artifact-id: ${{ needs.build_docker_env.outputs.image_artifact_id }}
        path: ${{ runner.temp }}
        expected-file: ${{ env.ZC_CI_IMAGE_ARCHIVE }}

    # This host setup step uses an explicit shell. The Docker exporter is
    # single-platform; the producer and every consumer intentionally use the
    # same ubuntu-latest runner architecture. If CI gains another architecture,
    # build and select a distinct artifact ID for it rather than silently
    # sharing this archive.
    - &load_ci_image
      name: Load prebuilt Docker image
      shell: bash
      env:
        IMAGE_ARCHIVE: ${{ runner.temp }}/${{ env.ZC_CI_IMAGE_ARCHIVE }}
        IMAGE_NAME: ${{ env.ZC_CI_IMAGE }}
      # Keep the large archive only as long as `docker load` needs it. The trap
      # also reclaims it if loading or validation fails, avoiding archive plus
      # expanded-image disk pressure for later diagnostic steps. `inspect`
      # proves the tag exists; the trivial run also proves that the archive
      # matches this runner's architecture.
      run: |
        set -euo pipefail
        trap 'rm -f -- "$IMAGE_ARCHIVE"' EXIT
        docker load --input "$IMAGE_ARCHIVE"
        docker image inspect "$IMAGE_NAME" >/dev/null
        docker run --rm "$IMAGE_NAME" true

    # The matrix values are data, not shell fragments. `cargo-zerocopy`
    # validates these selectors against the plan for this event, reconstructs
    # the typed argv and environment, and executes the complete cell. The
    # complete Docker bridge below is explicit so the audit sees how the
    # container is actually launched. The absolute Docker path
    # relies on the hosted Ubuntu runner contract and prevents a PATH shim from
    # returning success without starting a container. The entrypoint override
    # and Bash startup options prevent image startup behavior or exported
    # functions from intercepting the typed executor argv. The option
    # terminator forces the inherited image value to be parsed as an image. The
    # planned-job workflow audit in `planned_adapter/matrix.rs` checks the step
    # fields exactly and this run block line-for-line. Keep protocol spellings
    # coordinated through `tools/zc/src/workflow_protocol.rs`. Do not forward
    # GITHUB_ENV or GITHUB_PATH into the container: the typed executor has no
    # cross-step environment protocol, and it must remain the terminal step in
    # this job. `planned_adapter/matrix.rs` audits that exact order.
    - name: Execute checked build cell
      shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -p -euo pipefail -- {0}
      working-directory: zerocopy
      env:
        TOOLCHAIN: ${{ matrix.toolchain }}
        CRATE: ${{ matrix.crate }}
        FEATURE_PROFILE: ${{ matrix.feature_profile }}
        TARGET: ${{ matrix.target }}
      run: |
        set -euo pipefail
        /usr/bin/docker run --rm \
          --workdir "$PWD" \
          -v /home/runner/work:/home/runner/work \
          -v /home/runner/.docker-cargo/registry:/root/.cargo/registry \
          -v /home/runner/.docker-cargo/git:/root/.cargo/git \
          -e GITHUB_STEP_SUMMARY -e GITHUB_OUTPUT -e GITHUB_WORKSPACE \
          -e CI -e GITHUB_ACTIONS -e GITHUB_ACTOR -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_REF -e GITHUB_EVENT_NAME \
          -e TOOLCHAIN -e CRATE -e TARGET -e FEATURE_PROFILE \
          -e RUSTFLAGS -e RUSTDOCFLAGS -e MIRIFLAGS \
          -e CARGO_NET_RETRY -e RUSTUP_MAX_RETRIES \
          -e ZC_NIGHTLY_RUSTFLAGS -e ZC_NIGHTLY_MIRIFLAGS \
          -e GIT_CONFIG_COUNT=1 \
          -e GIT_CONFIG_KEY_0=safe.directory \
          -e "GIT_CONFIG_VALUE_0=*" \
          --entrypoint /bin/bash \
          -- \
          "$ZC_CI_IMAGE" \
          --noprofile \
          --norc \
          -p \
          ./cargo.sh ci execute-build-cell \
          --event "$GITHUB_EVENT_NAME" \
          --package "$CRATE" \
          --toolchain "$TOOLCHAIN" \
          --feature-profile "$FEATURE_PROFILE" \
          --target "$TARGET"

  # Semver needs a literal `uses` step, so it cannot run inside the typed
  # executor. Give it a fresh runner instead of sequencing it with ordinary
  # builds. This isolates the action in both directions: build setup cannot
  # alter semver's checkout or process environment, while code compiled by the
  # semver action cannot leave checkout or runner state for an ordinary build.
  # It also lets semver start as soon as planning finishes, in parallel with
  # Docker image production and the ordinary build fan-out.
  #
  # `plan.rs` selects semver work from checked policy and coverage;
  # `github.rs` projects only the target selectors below; and
  # `semver_adapter.rs` audits this complete job header and exact three-step
  # sequence. Keep those files, `workflow_protocol.rs`, the planner outputs
  # above, and the required-check aggregation below coordinated with this job.
  semver:
    if: needs.plan_ci.outputs.semver_enabled == 'true'
    runs-on: ubuntu-latest
    needs: [plan_ci]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # The planner emits a complete `include` object. Target selection and
      # waivers belong to `ci/zc.toml`; do not reproduce them as handwritten
      # axes, exclusions, or step conditions here.
      matrix: ${{ fromJSON(needs.plan_ci.outputs.semver_matrix) }}
    name: Semver (${{ matrix.target }})
    steps:
    # Unlike the ordinary matrix checkout, this needs enough history to read
    # the pull request head commit behind GitHub's synthetic merge commit. The
    # semver audit owns this complete step; do not reuse the matrix anchor.
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false

    # This preparation handles only the documented commit-message skip marker
    # and the vendored-source workaround. Its step-local output prevents an
    # ambient variable or unrelated step from suppressing the action. Keep its
    # shell, directory, environment, and run block coordinated exactly with
    # `SemverAdapterSpec` in `tools/zc/src/semver_adapter.rs`.
    - name: Prepare cargo-semver-checks
      id: prepare_semver
      shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -p -euo pipefail -- {0}
      working-directory: zerocopy
      env:
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail

        # Pull request jobs check the head commit rather than GitHub's synthetic
        # merge commit. `PR_HEAD_SHA`, the depth-2 checkout above, and this
        # lookup are one contract: if checkout stops fetching that object,
        # `git log` fails instead of silently inspecting another message.
        if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
          MESSAGE="$(/usr/bin/git log -1 --pretty=%B "$PR_HEAD_SHA")"
          MESSAGE_SOURCE='pull request head commit message'
        else
          MESSAGE="$(/usr/bin/git log -1 --pretty=%B HEAD)"
          MESSAGE_SOURCE='commit message'
        fi

        if /usr/bin/grep -Eq \
          '^[[:space:]]*SKIP_CARGO_SEMVER_CHECKS=1[[:space:]]*$' \
          <<< "$MESSAGE"; then
          printf "Found 'SKIP_CARGO_SEMVER_CHECKS=1' in the %s; " \
            "$MESSAGE_SOURCE" | /usr/bin/tee -a "$GITHUB_STEP_SUMMARY"
          printf 'skipping cargo-semver-checks.\n' | \
            /usr/bin/tee -a "$GITHUB_STEP_SUMMARY"
          printf 'run=false\n' >> "$GITHUB_OUTPUT"
        else
          # FIXME(#2906): cargo-semver-checks fetches the latest Zerocopy from
          # crates.io, but the vendored-source configuration cannot resolve
          # that package. This exact file removal affects only this isolated
          # checkout. Switch to --baseline-rev before removing the workaround.
          /usr/bin/rm .cargo/config.toml
          printf 'run=true\n' >> "$GITHUB_OUTPUT"
        fi

    # Check compatibility with the most recently published Zerocopy version.
    # The planner selects each supported non-waived target because some public
    # API is target-specific. Keep every literal and the action pin coordinated
    # with `SemverAdapterSpec`; changing any one makes `ci audit` fail.
    - name: Check semver compatibility
      uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
      env:
        # `zerocopy_unstable_ptr` exposes unstable API. Preserve warning denial
        # without inheriting that workflow-wide rustdoc cfg into this action.
        RUSTDOCFLAGS: -Dwarnings
        RUSTFLAGS: -Dwarnings
      with:
        # The proc-macro crate has no API cargo-semver-checks can understand.
        package: zerocopy
        # Use only explicitly named stable features. The action supports the
        # latest stable compiler, while nightly-only APIs carry no stability
        # guarantee.
        feature-group: only-explicit-features
        features: __internal_use_only_features_that_work_on_stable
        manifest-path: zerocopy/Cargo.toml
        # The action's automatic baseline-rustdoc cache key does not include
        # `rust-target`. Give concurrent targets distinct prefixes so they do
        # not race while reading and writing one cache entry.
        prefix-key: ${{ matrix.target }}
        # Keep this exact version coordinated with
        # `zerocopy/Cargo.toml`'s `package.metadata.ci.pinned-stable` and
        # `SemverAdapterSpec`. A partial stable-toolchain roll fails locally.
        rust-toolchain: 1.93.1
        rust-target: ${{ matrix.target }}
      if: |
        steps.prepare_semver.outputs.run == 'true'

  # Today's policy selects Miri only for full events because it is much more
  # expensive than the ordinary build matrix. Each borrow model is its own
  # matrix cell so the models and all eligible target/profile combinations can
  # run concurrently. The job itself follows the plan rather than repeating
  # that current policy.
  miri:
    # The planner derives this output solely from whether it selected any Miri
    # cells. Do not duplicate today's PR/full-event policy here: future policy
    # changes must automatically enable or skip this job with the matrix they
    # produce.
    if: needs.plan_ci.outputs.miri_enabled == 'true'
    runs-on: ubuntu-latest
    needs: [build_docker_env, plan_ci]
    permissions:
      contents: read
    strategy:
      # The matrix audit requires exactly this concurrency setting and the
      # matching plan output; extra strategy fields are rejected.
      fail-fast: false
      # A planner-disabled job skips before matrix expansion. When enabled, it
      # consumes exactly the Miri cells selected by the same checked plan used
      # by the executor below.
      matrix: ${{ fromJSON(needs.plan_ci.outputs.miri_matrix) }}

    name: Miri (${{ matrix.crate }} / ${{ matrix.toolchain }} / ${{ matrix.feature_profile }} / ${{ matrix.miri_model }} / ${{ matrix.target }})

    steps:
    - *matrix_checkout
    - *download_ci_image
    - *load_ci_image

    # As with ordinary cells, the workflow passes only selectors. Model flags,
    # feature arguments, the Cargo configuration transaction, and target
    # workarounds belong to the typed executor rather than this shell adapter.
    # This explicit Docker bridge does not rely on the generated job shell
    # actually executing its input. Its absolute Docker path, entrypoint
    # override, Bash startup options, and option terminator provide the same
    # fail-closed boundary as the ordinary build bridge. The matrix audit
    # checks the fields exactly and this run block line-for-line. Keep the
    # Miri-model and command spellings in `workflow_protocol.rs` coordinated.
    # Keep the same GITHUB_ENV/GITHUB_PATH exclusion as the build bridge so a
    # future step cannot inherit environment changes written by this container
    # without first extending the typed audit.
    - name: Execute checked Miri cell
      shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -p -euo pipefail -- {0}
      working-directory: zerocopy
      env:
        TOOLCHAIN: ${{ matrix.toolchain }}
        CRATE: ${{ matrix.crate }}
        FEATURE_PROFILE: ${{ matrix.feature_profile }}
        TARGET: ${{ matrix.target }}
        MIRI_MODEL: ${{ matrix.miri_model }}
      run: |
        set -euo pipefail
        /usr/bin/docker run --rm \
          --workdir "$PWD" \
          -v /home/runner/work:/home/runner/work \
          -v /home/runner/.docker-cargo/registry:/root/.cargo/registry \
          -v /home/runner/.docker-cargo/git:/root/.cargo/git \
          -e GITHUB_STEP_SUMMARY -e GITHUB_OUTPUT -e GITHUB_WORKSPACE \
          -e CI -e GITHUB_ACTIONS -e GITHUB_ACTOR -e GITHUB_REPOSITORY -e GITHUB_SHA -e GITHUB_REF -e GITHUB_EVENT_NAME \
          -e TOOLCHAIN -e CRATE -e TARGET -e FEATURE_PROFILE -e MIRI_MODEL \
          -e RUSTFLAGS -e RUSTDOCFLAGS -e MIRIFLAGS \
          -e CARGO_NET_RETRY -e RUSTUP_MAX_RETRIES \
          -e ZC_NIGHTLY_RUSTFLAGS -e ZC_NIGHTLY_MIRIFLAGS \
          -e GIT_CONFIG_COUNT=1 \
          -e GIT_CONFIG_KEY_0=safe.directory \
          -e "GIT_CONFIG_VALUE_0=*" \
          --entrypoint /bin/bash \
          -- \
          "$ZC_CI_IMAGE" \
          --noprofile \
          --norc \
          -p \
          ./cargo.sh ci execute-miri-cell \
          --event "$GITHUB_EVENT_NAME" \
          --package "$CRATE" \
          --toolchain "$TOOLCHAIN" \
          --feature-profile "$FEATURE_PROFILE" \
          --target "$TARGET" \
          --miri-model "$MIRI_MODEL"

  codegen:
    runs-on: ubuntu-latest
    name: Run codegen tests
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          set -eo pipefail
          sudo apt install -qq llvm
          # Snapshot generation calls this same helper, so generation and
          # validation cannot silently select different tool releases.
          bash ../tools/install-cargo-show-asm.sh

      - name: Clippy
        run: |
          ./cargo.sh +nightly clippy --locked \
            --package zerocopy \
            --target x86_64-unknown-linux-gnu \
            --all-features \
            --test codegen \
            --verbose \
            -- -Dwarnings

      - name: Run tests
        run: |
          RUSTFLAGS="$RUSTFLAGS -Awarnings" ./cargo.sh +nightly test --locked \
            --package zerocopy \
            --target x86_64-unknown-linux-gnu \
            --all-features \
            --verbose \
            --test codegen

  coverage:
    runs-on: ubuntu-latest
    name: Generate code coverage
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate code coverage
        run: |
          set -eo pipefail
          ./cargo.sh +nightly install --version 0.8.0 cargo-llvm-cov
          ./cargo.sh +nightly llvm-cov \
            --package zerocopy \
            --target x86_64-unknown-linux-gnu \
            --all-features \
            --doctests \
            --lcov \
            --output-path lcov.info \
            --verbose
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }} # zizmor: ignore[secrets-outside-env]
          files: zerocopy/lcov.info

  kani:
    runs-on: ubuntu-latest        
    name: 'Run tests under Kani'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          # Use `--features __internal_use_only_features_that_work_on_stable`
          # because the Kani GitHub Action uses its own pinned nightly
          # toolchain. Sometimes, we make changes to our nightly features for
          # more recent toolchains, and so our nightly features become
          # incompatible with the toolchain that Kani uses. By only testing
          # stable features, we ensure that this doesn't cause problems in CI.
          #
          # TODO(https://github.com/model-checking/kani-github-action/issues/56):
          # Go back to testing all features once the Kani GitHub Action supports
          # specifying a particular toolchain.
          args: "--manifest-path zerocopy/Cargo.toml --package zerocopy --features __internal_use_only_features_that_work_on_stable --output-format=terse -Zfunction-contracts --randomize-layout --memory-safety-checks --overflow-checks --undefined-function-checks --unwinding-checks"
          # This version is automatically rolled by
          # `roll-pinned-toolchain-versions.yml`.
          kani-version: 0.60.0

  # NEON intrinsics are currently broken on big-endian platforms. [1] This test ensures
  # that we don't accidentally attempt to compile these intrinsics on such platforms. We
  # can't use this as part of the build matrix because rustup doesn't support the
  # `aarch64_be-unknown-linux-gnu` target.
  #
  # [1] https://github.com/rust-lang/stdarch/issues/1484
  check_be_aarch64:
    runs-on: ubuntu-latest
    name: Build (zerocopy / nightly / --simd / aarch64_be-unknown-linux-gnu)
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure environment variables
        run: |
          set -eo pipefail
          RUSTFLAGS="$RUSTFLAGS $ZC_NIGHTLY_RUSTFLAGS"
          echo "RUSTFLAGS=$RUSTFLAGS" >> $GITHUB_ENV
      - name: Check big endian for aarch64_be-unknown-linux-gnu target
        run: |
          set -eo pipefail

          # FIXME(#2906): We do this because `cargo vendor` doesn't currently
          # support vendoring std's dependencies (required in order to build
          # std from source, as we do here). As a workaround, we simply nuke
          # the cargo config and bypass vendoring altogether. Eventually, we
          # should get vendoring working for std's dependencies too.
          #
          # See also: https://github.com/rust-lang/wg-cargo-std-aware/issues/23
          rm .cargo/config.toml

          ./cargo.sh +nightly build --target=aarch64_be-unknown-linux-gnu -Zbuild-std --features simd

  # We can't use this as part of the build matrix because rustup doesn't support
  # the `avr-none` target.
  check_avr_atmega:
    runs-on: ubuntu-latest
    name: Build (zerocopy / nightly / --simd / avr-none)
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure environment variables
        run: |
          set -eo pipefail
          RUSTFLAGS="$RUSTFLAGS $ZC_NIGHTLY_RUSTFLAGS"
          echo "RUSTFLAGS=$RUSTFLAGS" >> $GITHUB_ENV
      # FIXME(#2906): We do this because `cargo vendor` doesn't currently
      # support vendoring std's dependencies (required in order to build std
      # from source, as we do here). As a workaround, we simply nuke the cargo
      # config and bypass vendoring altogether. Eventually, we should get
      # vendoring working for std's dependencies too.
      #
      # See also: https://github.com/rust-lang/wg-cargo-std-aware/issues/23
      - name: Remove Cargo config
        run: rm .cargo/config.toml
      # NOTE: We cannot check tests because of a number of different issues (at
      # the time of writing):
      # - No `alloc::sync`
      # - Values of type `[u8; 32768]` are too big
      #
      # To try for yourself, replace `-Zbuild-std=core` with `-Zbuild-std` and
      # add `--tests`.
      - name: Check avr-none target
        run: RUSTFLAGS='-C target-cpu=atmega328p' ./cargo.sh +nightly check --target=avr-none -Zbuild-std=core --features simd,simd-nightly,float-nightly,derive
      - name: Clippy check avr-none target
        run: RUSTFLAGS='-C target-cpu=atmega328p' ./cargo.sh +nightly clippy --target=avr-none -Zbuild-std=core --features simd,simd-nightly,float-nightly,derive

  check_fmt:
    runs-on: ubuntu-latest
    name: Check Rust formatting
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Rust formatting
        run: ./ci/check_fmt.sh

  check_tools:
    runs-on: ubuntu-latest
    name: Check repository tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test repository tools
        run: ./ci/check_tools.sh

  check_stale_stderr:
    runs-on: ubuntu-latest
    name: Check stale stderr files
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check stale stderr
        run: ./ci/check_stale_stderr.sh

  check_actions:
    runs-on: ubuntu-latest
    name: Check GitHub Actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Actions
        run: ./ci/check_actions.sh

  check_readme:
    runs-on: ubuntu-latest
    name: Check README.md
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check README.md
        run: ./ci/check_readme.sh

  check_versions:
    runs-on: ubuntu-latest
    name: Check crate versions match
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Make sure that both crates are at the same version, and that zerocopy
      # depends exactly upon the current version of zerocopy-derive. See
      # `INTERNAL.md` for an explanation of why we do this.
      - name: Check crate versions match
        run: ./ci/check_versions.sh

  check_msrv_is_minimal:
    runs-on: ubuntu-latest
    name: Check MSRV is minimal
    defaults:
      run:
        working-directory: zerocopy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check MSRV is minimal
        run: ./ci/check_msrv_is_minimal.sh

  check-job-dependencies:
    runs-on: ubuntu-latest
    name: Check all-jobs-succeeded depends on all jobs
    steps:
      - name: Install yq (for YAML parsing)
        # FIXME(https://github.com/mikefarah/yq/issues/2587): Remove
        # `GONOSUMDB` once this bug is fixed.
        run: GONOSUMDB=github.com/mikefarah/yq/v4 go install github.com/mikefarah/yq/v4@v4.44.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run dependency check
        run: ./ci/check_job_dependencies.sh

  check-todo:
    runs-on: ubuntu-latest
    name: Check for todo comments
    steps:
      - name: Install ripgrep
        run: |
         sudo apt-get update
         sudo apt-get install ripgrep
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run todo check
        run: ./ci/check_todo.sh

  run-git-hooks:
    runs-on: ubuntu-latest
    name: Run Git hooks
    steps:
      - name: Install yq (for YAML parsing)
        # FIXME(https://github.com/mikefarah/yq/issues/2587): Remove
        # `GONOSUMDB` once this bug is fixed.
        run: GONOSUMDB=github.com/mikefarah/yq/v4 go install github.com/mikefarah/yq/v4@v4.44.1
      - name: Install ripgrep
        run: |
         sudo apt-get update
         sudo apt-get install ripgrep
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run dependency check
        # Ensure that Git hooks execute successfully.
        #
        # Note that this runs all hooks. As of this writing, the only Git hook
        # is `pre-push`. Running all hooks ensures that, if a new hook is added
        # which can't run in CI (at least not using this naive setup), we'll
        # notice and it will remind us to update this test.
        run: |
          set -eo pipefail
          for hook in ./githooks/*; do $hook; done

  zizmor:
    runs-on: ubuntu-latest
    name: zizmor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Only scan the .github directory to avoid scanning vendored dependencies
          inputs: .github
          persona: pedantic
          # Avoid failing CI on low-severity findings from token-backed online audits;
          # those still show up in the non-blocking SARIF upload workflow.
          min-severity: medium
          # We don't want to use GitHub Advanced Security because we want to
          # block the merge on zizmor failure, and the only way to do that
          # (without manually configuring a ruleset) is to fail the job, which
          # the action only does if advanced-security is false.
          advanced-security: false

  build_docker_env:
    name: Build Docker image
    runs-on: ubuntu-latest
    # Consumers select the upload by this immutable, producer-generated ID.
    # Do not replace it with a duplicated artifact-name string: an empty ID is
    # deliberately rejected by download-artifact-with-retry before fan-out.
    outputs:
      image_artifact_id: ${{ steps.upload_image.outputs.artifact-id }}
    permissions:
      contents: read
      packages: write # required to push docker caches to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker
        uses: ./.github/actions/setup-docker-with-retry
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate sanitized Docker tag
        id: docker_tag
        env:
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "tag=${REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build, cache, and export image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: .github/workflows/Dockerfile
          tags: ${{ env.ZC_CI_IMAGE }}
          provenance: false
          # The Docker exporter creates a single archive accepted directly by
          # `docker load`. Its gzip-compressed layers make the tar suitable for
          # upload-file-artifact's direct (non-ZIP) transfer. This path and tag
          # are coupled to the workflow-level producer/consumer values above.
          outputs: type=docker,dest=${{ runner.temp }}/${{ env.ZC_CI_IMAGE_ARCHIVE }},compression=gzip
          cache-from: |
            type=registry,ref=ghcr.io/google/zerocopy/zerocopy-ci-cache:${{ steps.docker_tag.outputs.tag }}
            type=registry,ref=ghcr.io/google/zerocopy/zerocopy-ci-cache:main
          # External pull requests have read-only package permissions, so they
          # can consume GHCR caches but cannot export updated cache layers.
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('type=registry,ref=ghcr.io/google/zerocopy/zerocopy-ci-cache:{0},mode=max', steps.docker_tag.outputs.tag) || '' }}

      # Uploading is the producer's final gate. Matrix jobs cannot start until
      # this succeeds and the job exposes its artifact ID, so no runner is spent
      # on an image that was only partially published.
      - name: Upload image for matrix jobs
        id: upload_image
        uses: ./.github/actions/upload-file-artifact
        with:
          name: ${{ env.ZC_CI_IMAGE_ARCHIVE }}
          path: ${{ runner.temp }}/${{ env.ZC_CI_IMAGE_ARCHIVE }}

  # Used to signal to branch protections that all other jobs have succeeded.
  all-jobs-succeed:
    # WARNING: The external branch-protection or ruleset setting expects this
    # exact display name. Coordinate any rename with that setting. The source
    # audit can enforce this spelling but cannot update repository settings.
    name: All checks succeeded (ci.yml)
    # Run even when a dependency fails, is skipped, or is cancelled, then
    # inspect every result explicitly. A skipped required check counts as
    # success in branch protection, so this aggregation must fail closed.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # The conclusion gate needs no repository authority. Keep this explicit so
    # a future workflow-level permission expansion cannot reach this job.
    permissions: {}
    # `planned_adapter/aggregate.rs` audits the minimum path from the planner,
    # both typed executors, and the semver adapter through
    # `check-job-dependencies`. That script remains the owner of every other job
    # in this complete dependency inventory.
    needs: [build_test, miri, semver, codegen, coverage, kani, check_be_aarch64, check_avr_atmega, check_fmt, check_tools, check_actions, check_readme, check_versions, check_msrv_is_minimal, check_stale_stderr, check-job-dependencies, check-todo, run-git-hooks, zizmor, build_docker_env, plan_ci]
    steps:
      - name: Reject workflow cancellation
        if: ${{ cancelled() }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -p -euo pipefail -- {0}
        run: exit 1

      # GitHub can omit a job output at promotion time if its secret scanner
      # produces a false positive. Keep this comparison in expression space
      # so the large JSON never enters a process environment. A disabled
      # optional plan is still the nonempty JSON value {"include":[]}; each
      # boolean gate must also be present and canonical before aggregation
      # trusts it.
      - name: Require published planner outputs
        if: ${{ needs.plan_ci.result == 'success' && (needs.plan_ci.outputs.build_matrix == '' || needs.plan_ci.outputs.miri_matrix == '' || needs.plan_ci.outputs.semver_matrix == '' || (needs.plan_ci.outputs.miri_enabled != 'true' && needs.plan_ci.outputs.miri_enabled != 'false') || (needs.plan_ci.outputs.semver_enabled != 'true' && needs.plan_ci.outputs.semver_enabled != 'false')) }}
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -p -euo pipefail -- {0}
        run: exit 1

      - name: Require every dependency to succeed
        # Pin the absolute interpreter and remove Bash startup controls so a
        # job default, PATH shim, or exported function cannot turn this
        # required-check assertion into a successful no-op.
        shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS /bin/bash --noprofile --norc -p -euo pipefail -- {0}
        env:
          # Do not serialize the entire `needs` object here: job outputs may
          # legitimately approach GitHub's configured output limit, while a
          # Linux process has a much smaller per-environment-value limit.
          # Results stay small regardless of matrix JSON size. Separate
          # optional-job results identify the only dependencies which may be
          # skipped, and couple each skip to its planner-derived gate.
          RESULTS_JSON: ${{ toJSON(needs.*.result) }}
          MIRI_ENABLED: ${{ needs.plan_ci.outputs.miri_enabled }}
          MIRI_RESULT: ${{ needs.miri.result }}
          SEMVER_ENABLED: ${{ needs.plan_ci.outputs.semver_enabled }}
          SEMVER_RESULT: ${{ needs.semver.result }}
        # The aggregate audit checks this hosted absolute jq path and the run
        # block line-for-line.
        run: |
          set -euo pipefail
          /usr/bin/jq -e \
            --arg miri_enabled "$MIRI_ENABLED" \
            --arg miri "$MIRI_RESULT" \
            --arg semver_enabled "$SEMVER_ENABLED" \
            --arg semver "$SEMVER_RESULT" '
            def optional_job_ok($enabled; $result):
              ($enabled == "false" and $result == "skipped") or
              ($enabled == "true" and $result == "success");
            type == "array" and length > 0 and
            optional_job_ok($miri_enabled; $miri) and
            optional_job_ok($semver_enabled; $semver) and
            ([.[] | select(. == "skipped")] | length) ==
              ([$miri_enabled, $semver_enabled] |
                map(select(. == "false")) | length) and
            all(.[]; . == "success" or . == "skipped")
          ' <<< "$RESULTS_JSON"
