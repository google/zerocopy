name: CI (PR)

on:
  pull_request:

permissions: {}

jobs:
  ci-core:
    name: ci-core
    uses: joshlf/ci-core/.github/workflows/ci-pr.yml@629e371f0c7c4ad4e3a3c98f09b12104f314150e
    with:
      config_path: ci/checks.toml
      shadow_mode: true
    permissions:
      actions: read # Read PR workflow-run and job attempt metadata.
      contents: read # Bare-fetch target and base commits.
      packages: read # Pull attested GHCR image and check receipts.
      pull-requests: read # Read live owner PR reviews.
