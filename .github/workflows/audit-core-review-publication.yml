# Temporary publication runner; this file is not part of PR #3675.
name: Audit core review publication
'on':
  push:
    branches: [joshlf/audit-core-review-runner-20260912]
permissions:
  contents: read
concurrency:
  group: audit-core-review-publication
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CARGO_ZEROCOPY_AUTO_INSTALL_TOOLCHAIN: '1'
      CARGO_TERM_COLOR: always
      EXPECTED_BASE: c0317a67a04a0f19fdfe6421bdb3c2c3b0268ce0
      RUSTFLAGS: -Dwarnings
      RUSTDOCFLAGS: -Dwarnings --cfg=zerocopy_unstable_ptr
    steps:
      - name: Check out the verified PR head, not this runner branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c0317a67a04a0f19fdfe6421bdb3c2c3b0268ce0
          fetch-depth: 0
          persist-credentials: false
      - name: Verify citations and replace only the safety comment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          test "$(git ls-remote origin refs/heads/joshlf/audit-core-fixes-20260912 | cut -f1)" = "$EXPECTED_BASE"
          python3 - <<'PY'
          import html
          import re
          import subprocess
          import textwrap
          import urllib.request
          from pathlib import Path

          sources = {
              'std/mem/fn.transmute.html': [
                  'transmute is semantically equivalent to a bitwise move of one type into another.',
                  'Both the argument and the result must be valid at their given type.',
              ],
              'reference/type-layout.html': [
                  'Pointers and references have the same layout.',
                  'Pointers to sized types have the same size and alignment as usize.',
                  'Start with a current offset of 0 bytes.',
                  'The offset for the field is what the current offset is now.',
              ],
              'std/primitive.reference.html': [
                  'a reference is just a pointer that is assumed to be aligned, not null, and pointing to memory containing a valid value of T',
                  'References have a lifetime attached to them, which represents the scope for which the borrow is valid.',
              ],
              'reference/behavior-considered-undefined.html': [
                  '&T must point to memory that is not mutated while they are live',
                  '(except for data inside an UnsafeCell<U>)',
              ],
          }
          for suffix, quotations in sources.items():
              url = 'https://doc.rust-lang.org/1.93.1/' + suffix
              with urllib.request.urlopen(url, timeout=60) as response:
                  page = response.read().decode('utf-8')
              page = ' '.join(html.unescape(re.sub(r'<[^>]*>', ' ', page)).split())
              for quotation in quotations:
                  assert quotation in page, ('Quotation missing from versioned source', url, quotation)
              print('Verified:', url)

          path = Path('zerocopy/src/wrappers.rs')
          original = path.read_text()
          signature = '    pub const unsafe fn deref_unchecked(&self) -> &T {\n'
          assert original.count(signature) == 1
          start = original.index(signature) + len(signature)
          end = original.index('        unsafe { mem::transmute(self) }', start)
          old = original[start:end]
          assert all(not line.strip() or line.lstrip().startswith('//') for line in old.splitlines())
          replacement = textwrap.indent(textwrap.dedent('''
          // SAFETY: `mem::transmute` performs a bitwise move and requires valid
          // source and result values [1]. Both reference types are equally sized:
          // `Unalign<T>` and `T` are sized, and references to sized types have the
          // size and alignment of `usize` [2].
          //
          // `Unalign<T>` is a single-field `repr(C, packed)` struct. The `repr(C)`
          // algorithm starts at offset zero [3]. Zero satisfies every alignment,
          // including the packing-adjusted field alignment, so no leading padding
          // is added and the sole field is at offset zero. The bitwise move of
          // this reference therefore designates the same field at the same address;
          // it does not convert through an integer or reconstruct a pointer.
          //
          // The source shared reference is valid and non-null. The field contains
          // a valid `T`, and the caller supplies the otherwise-missing alignment
          // guarantee for `T`. Thus the result meets the reference requirements
          // of alignment, non-nullness, and a valid referent [4]. `Unalign<T>`'s
          // documented contract guarantees that it and `T` have `UnsafeCell`s at
          // the same byte ranges. Consequently, their shared references prohibit
          // mutation of the same bytes [5]; this does not strengthen the source
          // borrow's mutation restrictions. The output lifetime is tied to `self`,
          // so the result cannot outlive that borrow or its live storage [4].
          //
          // [1] Per https://doc.rust-lang.org/1.93.1/std/mem/fn.transmute.html:
          //
          //   `transmute` is semantically equivalent to a bitwise move [...].
          //   ...
          //   Both the argument and the result must be valid at their given type.
          //
          // [2] Per https://doc.rust-lang.org/1.93.1/reference/type-layout.html#pointers-and-references-layout:
          //
          //   Pointers and references have the same layout.
          //   ...
          //   Pointers to sized types have the same size and alignment as `usize`.
          //
          // [3] Per https://doc.rust-lang.org/1.93.1/reference/type-layout.html#reprc-structs:
          //
          //   Start with a current offset of 0 bytes.
          //   ...
          //   The offset for the field is what the current offset is now.
          //
          // [4] Per https://doc.rust-lang.org/1.93.1/std/primitive.reference.html:
          //
          //   [A] reference is just a pointer that is assumed to be aligned, not
          //   null, and pointing to memory containing a valid value of `T` [...].
          //   ...
          //   References have a lifetime attached to them, which represents the
          //   scope for which the borrow is valid.
          //
          // [5] Per https://doc.rust-lang.org/1.93.1/reference/behavior-considered-undefined.html#undefined-alias:
          //
          //   `&T` must point to memory that is not mutated while they are live
          //   (except for data inside an `UnsafeCell<U>`).
          //
          // We use `mem::transmute` instead of `&*self.get_ptr()` because
          // dereferencing pointers is not stable in `const` on our current MSRV
          // (1.56 as of this writing).
          ''').strip('\n') + '\n', ' ' * 8)
          assert all(line.lstrip().startswith('//') for line in replacement.splitlines())
          updated = original[:start] + replacement + original[end:]
          path.write_text(updated)
          assert updated.replace(replacement, '', 1) == original.replace(old, '', 1)
          changed = subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          assert changed == ['zerocopy/src/wrappers.rs'], changed
          PY
          git diff --check
          git diff
      - name: Validate the unchanged implementation and its documentation
        shell: bash
        run: |
          set -euo pipefail
          cd zerocopy
          ./cargo.sh +msrv test -p zerocopy --lib test_unalign
          ./cargo.sh +stable test -p zerocopy --doc --features __internal_use_only_features_that_work_on_stable
          ./cargo.sh +stable doc -p zerocopy --no-deps --features __internal_use_only_features_that_work_on_stable
          ./cargo.sh +nightly fmt --all -- --check
      - name: Publish only an isolated staging ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          command -v gh
          test "$(git diff --name-only)" = zerocopy/src/wrappers.rs
          git diff --check
          git add -- zerocopy/src/wrappers.rs
          git -c user.name="Josh Liebow-Feeser's Agent" -c user.email=agent@joshlf.invalid commit -m 'Complete the unaligned reference-transmute proof' -m 'Cite the versioned reference layout, transmute, reference-validity, and shared-aliasing rules. Explain the existing Unalign contract and borrow lifetime alongside the offset-zero argument. This changes only the safety comment; the signature, representation, and executable code are unchanged.' -m "Agent-Authored-By: AI agent acting on Josh Liebow-Feeser's behalf"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          stage_branch="joshlf/audit-core-review-stage-${GITHUB_RUN_ID}"
          test -z "$(git ls-remote origin "refs/heads/$stage_branch")"
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/heads/$stage_branch"
          printf 'Staged commit: `%s`\n\nStaging branch: `%s`\n' "$(git rev-parse HEAD)" "$stage_branch" >> "$GITHUB_STEP_SUMMARY"
          echo "STAGED_COMMIT=$(git rev-parse HEAD)"
          echo "STAGING_BRANCH=$stage_branch"
