# Once a week, attempt to roll the pinned nightly and stable toolchain versions
# and update the codebase as necessary (in particular, by regenerating the files
# which store expected compiler output for UI tests; this output is not stable
# and may change between compiler versions). On success, submit the changes as a
# new PR. Note that this does not guarantee that the roll will succeed: PRs go
# through many tests which are not exercised here, and so the generated PR may
# still fail CI. In particular, some nightly releases do not support all of the
# target architectures that we use in CI; attempting to roll to any such release
# will fail.

name: Roll pinned toolchain versions
on:
  schedule:
    - cron: '29 09 * * 1'
  workflow_dispatch:

permissions: {}

env:
  CARGO_ZEROCOPY_AUTO_INSTALL_TOOLCHAIN: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roll_rust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to create pull requests
    strategy:
      # By default, this is set to `true`, which means that a single CI job
      # failure will cause all outstanding jobs to be canceled. This means that
      # if, for example, rolling the nightly toolchain on a particular branch
      # fails, all other rollers (which might have succeeded) will be canceled.
      fail-fast: false
      matrix:
        toolchain: ["stable", "nightly"]
        branch: ["main"]
    name: Roll pinned toolchain ${{ matrix.toolchain }} version on ${{ matrix.branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - name: Calculate target version
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -eo pipefail

          if [ "$TOOLCHAIN" == stable ]; then
            # Hosted runners may have an older `stable` toolchain installed.
            # Update it explicitly so that this roller means "latest stable",
            # independent of changes to the runner image.
            rustup update stable --no-self-update
            echo "ZC_TARGET_TOOLCHAIN=stable" >> "$GITHUB_ENV"
          else
            # Use yesterday's date (`-d '-1 day'`) so we're sure the nightly for
            # that date has actually been published yet. This allows us to not
            # worry about what time of day this job runs.
            echo "ZC_TARGET_TOOLCHAIN=nightly-$(date -d '-1 day' +%Y-%m-%d)" \
              >> "$GITHUB_ENV"
          fi

      - name: Update files
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -eo pipefail

          function update-pinned-version {
            VERSION_NAME="$1"
            VERSION="$2"
            ZEROCOPY_FEATURES="$3"

            # Confirm that `zerocopy/Cargo.toml` lists exactly one pinned
            # version in the expected format. This is a prerequisite for the
            # subsequent `sed` command. Requiring exactly one match makes a
            # future manifest reorganization fail visibly instead of silently
            # editing only some of the version declarations.
            REGEX="^pinned-$VERSION_NAME = \"[a-z0-9\.-]*\"$"
            MATCH_COUNT="$(grep -Ec "$REGEX" zerocopy/Cargo.toml || true)"
            if [ "$MATCH_COUNT" -ne 1 ]; then
              echo "Expected exactly one line matching '$REGEX' in" \
                "zerocopy/Cargo.toml; found $MATCH_COUNT" >&2
              exit 1
            fi
            sed -i -e \
              "s/$REGEX/pinned-$VERSION_NAME = \"$VERSION\"/" \
              zerocopy/Cargo.toml

            # Confirm that the update produced precisely the requested value.
            grep -Fx "pinned-$VERSION_NAME = \"$VERSION\"" \
              zerocopy/Cargo.toml >/dev/null

            # Run `cargo fix` in case there are any warnings or errors
            # introduced on this new toolchain that we can fix automatically.
            # This is best-effort, so we don't let failure cause the whole job
            # to fail.
            ./zerocopy/cargo.sh "+$VERSION_NAME" fix --allow-dirty --tests --package zerocopy $ZEROCOPY_FEATURES || true
            ./zerocopy/cargo.sh "+$VERSION_NAME" fix --allow-dirty --tests --package zerocopy-derive             || true

            ./tools/update-expected-test-output.sh
          }

          function update-tools-toolchain {
            VERSION="$1"

            # `zerocopy/cargo.sh` builds repository tools from the `tools`
            # directory, so rustup selects this pin before cargo-zerocopy can
            # read the library's Cargo metadata. Keep this explicit copy
            # coordinated with the stable pin above. This explicit update and
            # the exact-match checks make a future file reorganization fail
            # visibly instead of silently leaving the tools compiler behind.
            REGEX='^channel = "[0-9]+\.[0-9]+\.[0-9]+"$'
            MATCH_COUNT="$(
              grep -Ec "$REGEX" tools/rust-toolchain.toml || true
            )"
            if [ "$MATCH_COUNT" -ne 1 ]; then
              echo "Expected exactly one line matching '$REGEX' in" \
                "tools/rust-toolchain.toml; found $MATCH_COUNT" >&2
              exit 1
            fi
            sed -i -E \
              "s/$REGEX/channel = \"$VERSION\"/" \
              tools/rust-toolchain.toml
            grep -Fx "channel = \"$VERSION\"" \
              tools/rust-toolchain.toml >/dev/null
          }

          if [ "$TOOLCHAIN" == stable ]; then
            STABLE_VERSION="$(
              rustc +stable --version --verbose \
                | sed -nE 's/^release: ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p'
            )"
            if ! [[ "$STABLE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Could not determine the latest stable rustc version" >&2
              exit 1
            fi
            update-tools-toolchain "$STABLE_VERSION"
            update-pinned-version stable "$STABLE_VERSION" \
              '--features __internal_use_only_features_that_work_on_stable'

            # Used as part of the branch name created by the "Submit PR" step.
            echo "ZC_VERSION_FOR_BRANCH_NAME=$STABLE_VERSION" \
              >> "$GITHUB_ENV"
          else
            update-pinned-version nightly "$ZC_TARGET_TOOLCHAIN" --all-features
            echo "ZC_VERSION_FOR_BRANCH_NAME=$ZC_TARGET_TOOLCHAIN" \
              >> "$GITHUB_ENV"
          fi

      - name: Submit PR
        id: submit-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1 # zizmor: ignore[superfluous-actions]
        with:
          commit-message: "[ci] Roll pinned ${{ matrix.toolchain }} toolchain"
          author: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          committer: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          title: "[ci] Roll pinned ${{ matrix.toolchain }} toolchain"
          body: "${{ matrix.toolchain == 'nightly' && 'On failure, consider [manually creating roll PRs](https://github.com/google/zerocopy/actions/workflows/roll-pinned-toolchain-versions.yml) for previous nightlies to bisect the failure.' || '' }}"
          branch: roll-pinned-${{ matrix.toolchain }}-toolchain-to-${{ env.ZC_VERSION_FOR_BRANCH_NAME }}-for-${{ matrix.branch }}
          push-to-fork: google-pr-creation-bot/zerocopy
          token: ${{ secrets.GOOGLE_PR_CREATION_BOT_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Add labels
        if: steps.submit-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.submit-pr.outputs.pull-request-number }}
        run: gh pr edit "$PR_NUMBER" --add-label "hide-from-release-notes"
          
  roll_kani:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required to create pull requests
    strategy:
      # A failure on one release branch must not cancel otherwise-independent
      # rolls for the other branches.
      fail-fast: false
      matrix:
        branch: ["main", "v0.7.x"]
    name: Roll pinned Kani version on ${{ matrix.branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false
      - run: |
          set -eo pipefail

          # `cargo add --dry-run` prints versions of transitive dependencies as
          # well as the selected Kani version. Parsing every SemVer from that
          # output once produced a multi-line GITHUB_ENV value and broke this
          # roller. `cargo search --limit 1` has one anchored record for the
          # named package; fail if its format ever changes.
          KANI_SEARCH="$(
            cargo search kani-verifier \
              --registry crates-io \
              --limit 1 \
              --color never
          )"
          KANI_LATEST="$(
            sed -nE \
              's/^kani-verifier = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' \
              <<< "$KANI_SEARCH"
          )"
          if ! [[ "$KANI_LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not parse a Kani version from: $KANI_SEARCH" >&2
            exit 1
          fi
          echo "ZC_KANI_LATEST=$KANI_LATEST" >> "$GITHUB_ENV"

          # Update the `kani-version:` argument in-place.
          MATCH_COUNT="$(
            grep -Ec '^ *kani-version: [0-9]+\.[0-9]+\.[0-9]+$' \
              .github/workflows/ci.yml || true
          )"
          if [ "$MATCH_COUNT" -ne 1 ]; then
            echo "Expected exactly one Kani version in ci.yml; found $MATCH_COUNT" >&2
            exit 1
          fi
          sed -i -E -e \
            "s/^( *kani-version:)( [0-9]+\.[0-9]+\.[0-9]+)/\1 $KANI_LATEST/" \
            .github/workflows/ci.yml
          grep -E "^ *kani-version: $KANI_LATEST$" \
            .github/workflows/ci.yml >/dev/null
      - name: Submit PR
        id: submit-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1 # zizmor: ignore[superfluous-actions]
        with:
          commit-message: "[ci] Roll pinned Kani version"
          author: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          committer: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          title: "[ci] Roll pinned Kani version"
          branch: roll-pinned-kani-to-${{ env.ZC_KANI_LATEST }}-for-${{ matrix.branch }}
          push-to-fork: google-pr-creation-bot/zerocopy
          token: ${{ secrets.GOOGLE_PR_CREATION_BOT_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Add labels
        if: steps.submit-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.submit-pr.outputs.pull-request-number }}
        run: gh pr edit "$PR_NUMBER" --add-label "hide-from-release-notes"
