name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'zerocopy/Cargo.toml'
      - 'zerocopy/zerocopy-derive/Cargo.toml'
      - 'anneal/trusted/cargo-anneal/Cargo.toml'
  workflow_dispatch:
    inputs:
      project:
        description: Project to release
        type: choice
        required: true
        default: zerocopy
        options:
          - zerocopy
          - anneal
      version:
        description: Crate version to prepare
        required: true
        type: string
      branch:
        description: Branch to update
        required: true
        type: string
        default: main

# We set no permissions at the top level, and instead set them granularly for
# each job.
permissions: {}

jobs:
  check-version:
    name: Check if version was updated
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.repository == 'google/zerocopy'
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    env:
      CARGO_ZEROCOPY_AUTO_INSTALL_TOOLCHAIN: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Fetch all history for version comparison and tags

      # Checks whether zerocopy's version (in `zerocopy/Cargo.toml`) or
      # zerocopy-derive's version (in `zerocopy/zerocopy-derive/Cargo.toml`) were
      # updated in this commit.
      # We check below to make sure they're the same; the point of checking both
      # (which is unnecessary if the commit correctly updates both) is to catch
      # situations where one is updated – we want to catch it regardless of
      # *which* one is updated.
      - name: Determine if version was updated
        id: check
        run: |
          set -eo pipefail

          function cargo_zc {
            # This helper lets the first commit which introduces the nested
            # zerocopy/ layout compare versions against its parent commit, which
            # still has cargo.sh at the repository root.
            if [[ -x zerocopy/cargo.sh ]]; then
              (cd zerocopy && ./cargo.sh "$@")
            else
              ./cargo.sh "$@"
            fi
          }

          # Get current versions
          #
          # Pre-install toolchains so `rustup` output isn't piped to `jq`.
          cargo_zc +stable help > /dev/null
          CUR_VER_ZC=$(cargo_zc +stable metadata -q --format-version 1 | jq -r '.packages[] | select(.name == "zerocopy").version')
          CUR_VER_DERIVE=$(cargo_zc +stable metadata -q --format-version 1 | jq -r '.packages[] | select(.name == "zerocopy-derive").version')

          # Get previous versions using cargo metadata by temporarily checking it out
          git checkout -q HEAD^
          # Pre-install toolchains so `rustup` output isn't piped to `jq`.
          cargo_zc +stable help > /dev/null
          PREV_VER_ZC=$(cargo_zc +stable metadata -q --format-version 1 | jq -r '.packages[] | select(.name == "zerocopy").version')
          PREV_VER_DERIVE=$(cargo_zc +stable metadata -q --format-version 1 | jq -r '.packages[] | select(.name == "zerocopy-derive").version')
          git checkout -q -

          if [ "$CUR_VER_ZC" != "$PREV_VER_ZC" ] || [ "$CUR_VER_DERIVE" != "$PREV_VER_DERIVE" ]; then
            echo "Version change detected."
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "version=$CUR_VER_ZC" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged."
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

  release:
    name: Release to crates.io and GitHub
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: zerocopy
    # This environment is configured to require manual review before executing
    # this job.
    environment: release
    permissions:
      contents: write # required to create a git tag and a GitHub Release
      id-token: write # required to publish to crates.io using OIDC
      issues: read # required to query New Contributors via GraphQL search
      pull-requests: read # required to resolve PR metadata for release notes
    env:
      CARGO_ZEROCOPY_AUTO_INSTALL_TOOLCHAIN: 1
      RELEASE_TAG: v${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Sanity check versions
        run: ./ci/check_versions.sh

      - name: Dry-run publish
        run: |
          set -eo pipefail
          # Temporarily disable vendoring so that `cargo publish` can see the
          # live registry and resolve workspace dependencies correctly.
          mv .cargo/config.toml .cargo/config.toml.bak
          ./cargo.sh +stable publish --dry-run --allow-dirty --package zerocopy-derive --registry crates-io
          mv .cargo/config.toml.bak .cargo/config.toml

      - name: Check if tag already exists
        run: |
          set -eo pipefail
          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Error: Tag $RELEASE_TAG already exists." >&2
            exit 1
          fi

      - name: Generate release notes
        working-directory: .
        env:
          ACTIONS_CACHE_URL: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_URL: ''
          ACTIONS_RESULTS_URL: ''
          ACTIONS_RUNTIME_TOKEN: ''
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          python3 .github/release_notes.py \
            --tag "$RELEASE_TAG" \
            --target HEAD \
            --path zerocopy \
            > "$RUNNER_TEMP/release-notes.md"

      - name: Create git tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          git config user.name "Google PR Creation Bot"
          git config user.email "github-pull-request-creation-bot@google.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git "$RELEASE_TAG"
        
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth

      # NOTE: Relies on OIDC to be configured for this GHA workflow.
      - name: Publish zerocopy-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -eo pipefail
          mv .cargo/config.toml .cargo/config.toml.bak
          ./cargo.sh +stable publish --allow-dirty --package zerocopy-derive --registry crates-io
          mv .cargo/config.toml.bak .cargo/config.toml

      # This should *technically* be unnecessary since `cargo publish` blocks
      # until the published crate is available in the API, but we have observed
      # this failing occasionally, presumably due to eventual consistency. 60
      # seconds is likely overkill, but better safe than sorry.
      - name: Wait for crates.io index propagation
        run: sleep 60

      # NOTE: Relies on OIDC to be configured for this GHA workflow.
      - name: Publish zerocopy
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -eo pipefail
          mv .cargo/config.toml .cargo/config.toml.bak

          # Dry-run first to catch any last-minute issues now that
          # `zerocopy-derive` is on crates.io.
          ./cargo.sh +stable publish --dry-run --allow-dirty --package zerocopy --registry crates-io

          ./cargo.sh +stable publish --allow-dirty --package zerocopy --registry crates-io
          mv .cargo/config.toml.bak .cargo/config.toml

      - name: Create GitHub Release
        uses: ./.github/actions/publish-github-release
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          notes-file: ${{ runner.temp }}/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  prepare-zerocopy:
    name: Prepare Zerocopy release
    if: github.event_name == 'workflow_dispatch' && inputs.project == 'zerocopy'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/release-crate-version.yml
    with:
      version: ${{ inputs.version }}
      branch: ${{ inputs.branch }}
    secrets:
      GOOGLE_PR_CREATION_BOT_TOKEN: ${{ secrets.GOOGLE_PR_CREATION_BOT_TOKEN }}

  anneal-build-archive:
    name: Prepare Anneal release archive
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.project == 'anneal'
      && inputs.branch == 'main' && github.ref == 'refs/heads/main'
      && github.repository == 'google/zerocopy'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      source: ${{ steps.prepare.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage the release source
        id: prepare
        working-directory: anneal
        env:
          VERSION: ${{ inputs.version }}
          ACTIONS_CACHE_URL: ''
          ACTIONS_RESULTS_URL: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_RUNTIME_URL: ''
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          source="$(python3 -B ci/alpha_release.py "$VERSION" --prepare)"
          git checkout --detach "$source"
          printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"
      - uses: DeterminateSystems/determinate-nix-action@92957199488000b908fdad19f63711000965d8f3 # v3.24.1
      - name: Build the pinned x86-64 Linux toolchain
        working-directory: anneal
        env:
          ACTIONS_CACHE_URL: ''
          ACTIONS_RESULTS_URL: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_RUNTIME_URL: ''
        run: |
          set -euo pipefail
          archive="$(nix build .#omnibus-archive --no-link --print-out-paths --max-jobs 1 --cores 2)"
          cp "$archive" "$RUNNER_TEMP/anneal-toolchain-linux-x86_64.tar.zst"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anneal-alpha-archive
          path: ${{ runner.temp }}/anneal-toolchain-linux-x86_64.tar.zst
          compression-level: 0
          if-no-files-found: error

  anneal-host-archive:
    name: Host the archive and open the Anneal release PR
    needs: anneal-build-archive
    runs-on: ubuntu-latest
    concurrency:
      group: anneal-prepare-${{ inputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anneal-alpha-archive
          path: ${{ runner.temp }}/anneal-alpha
      - name: Recreate the archive source
        working-directory: anneal
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.anneal-build-archive.outputs.source }}
          ACTIONS_CACHE_URL: ''
          ACTIONS_RESULTS_URL: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_RUNTIME_URL: ''
        run: |
          set -euo pipefail
          source="$(python3 -B ci/alpha_release.py "$VERSION" --prepare)"
          test "$source" = "$SOURCE_SHA"
      - name: Host the immutable archive
        working-directory: anneal
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ needs.anneal-build-archive.outputs.source }}
          ACTIONS_CACHE_URL: ''
          ACTIONS_RESULTS_URL: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_RUNTIME_URL: ''
        run: |
          set -euo pipefail
          tag="$(env -u GH_TOKEN python3 -B ci/alpha_release.py "$VERSION")"
          asset=anneal-toolchain-linux-x86_64.tar.zst
          archive="$RUNNER_TEMP/anneal-alpha/$asset"
          tag_api="repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"
          read_tag() {
            gh api "$tag_api" --jq '.object | select(.type == "commit") | .sha'
          }
          expected=''
          if ! gh release view "$tag" >/dev/null 2>&1; then
            if ! target="$(read_tag 2>/dev/null)"; then
              git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
                push origin "$SOURCE_SHA:refs/tags/$tag"
              target="$(read_tag)"
            fi
            test "$target" = "$SOURCE_SHA"
            expected="$(sha256sum "$archive" | cut -d ' ' -f1)"
            gh release create "$tag" "$archive" --verify-tag --prerelease \
              --title "Anneal alpha toolchain $VERSION" \
              --notes "Pinned x86-64 Linux omnibus archive built from $SOURCE_SHA."
          fi
          target="$(read_tag)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          if [ -n "$expected" ]; then
            test "$target" = "$SOURCE_SHA"
          fi
          digest="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" |
            jq -er --arg asset "$asset" '
              select(.prerelease and (.draft | not)) |
              [.assets[] | select(.name == $asset and .state == "uploaded")] |
              select(length == 1) | .[0].digest | select(test("^sha256:[0-9a-f]{64}$"))
            ')"
          digest="${digest#sha256:}"
          test -z "$expected" || test "$digest" = "$expected"
          env -u GH_TOKEN git fetch --no-tags origin "$target"
          env -u GH_TOKEN python3 -B ci/alpha_release.py "$VERSION" \
            --archive-base "$target" --archive-tree "$SOURCE_SHA" --pin "$digest"
      - name: Open the Anneal release PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 # zizmor: ignore[superfluous-actions]
        with:
          commit-message: |
            Release Anneal ${{ inputs.version }}

            Set the CLI version and pin the hosted toolchain digest. When the
            version changes, update the workspace lockfile version and its
            pinned SHA-256 together.
          author: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          committer: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          title: "Release Anneal ${{ inputs.version }}"
          body: |
            ## Human review surface

            Set the CLI version and pin the published x86-64 Linux toolchain
            in `anneal/trusted/cargo-anneal/Cargo.toml`. When the version
            changes, update `anneal/Cargo.lock` and its SHA-256 in
            `anneal/trusted/root-manifest.sha256`. Review the source commit
            and digest on the toolchain release. Policy relaxations. None.
          base: main
          branch: anneal-release-${{ inputs.version }}
          add-paths: |
            anneal/trusted/cargo-anneal/Cargo.toml
            anneal/Cargo.lock
            anneal/trusted/root-manifest.sha256
          push-to-fork: google-pr-creation-bot/zerocopy
          token: ${{ secrets.GOOGLE_PR_CREATION_BOT_TOKEN }} # zizmor: ignore[secrets-outside-env]

  check-anneal-release:
    name: Check for a new Anneal release
    if: >-
      github.event_name == 'push'
      && github.ref == 'refs/heads/main' && github.repository == 'google/zerocopy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      commit: ${{ steps.check.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find the commit that pins the release
        id: check
        working-directory: anneal
        env:
          BEFORE: ${{ github.event.before }}
          ACTIONS_CACHE_URL: ''
          ACTIONS_RESULTS_URL: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_RUNTIME_URL: ''
        run: |
          set -euo pipefail
          python3 -B ci/alpha_release.py --changed-since "$BEFORE" >> "$GITHUB_OUTPUT"

  anneal-qualify-package:
    name: Qualify the packaged Anneal alpha
    needs: check-anneal-release
    if: needs.check-anneal-release.outputs.commit != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ needs.check-anneal-release.outputs.version }}
      commit: ${{ needs.check-anneal-release.outputs.commit }}
    env:
      CARGO_BUILD_JOBS: 2
      ACTIONS_CACHE_URL: ''
      ACTIONS_RESULTS_URL: ''
      ACTIONS_RUNTIME_TOKEN: ''
      ACTIONS_RUNTIME_URL: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-anneal-release.outputs.commit }}
          persist-credentials: false
      - name: Check Anneal publishing environment protections
        run: |
          set -euo pipefail
          environment_api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/environments/anneal-release"
          # GitHub can create a missing job environment without protections.
          curl -fsS --retry 3 "$environment_api" | jq -e '
            .deployment_branch_policy.custom_branch_policies == true and
            any(.protection_rules[];
                .type == "required_reviewers" and (.reviewers | length > 0))
          '
          curl -fsS --retry 3 "$environment_api/deployment-branch-policies?per_page=2" | jq -e '
            .total_count == 1 and [.branch_policies[] | {name, type}] ==
            [{"name": "main", "type": "branch"}]
          '
      - name: Package, install, and verify a scalar function
        working-directory: anneal
        env:
          VERSION: ${{ needs.check-anneal-release.outputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          tag="$(python3 -B ci/alpha_release.py "$VERSION" --require-pinned)"
          target="$(git ls-remote --refs origin "refs/tags/$tag" | cut -f 1)"
          [[ "$target" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$target"
          python3 -B ci/alpha_release.py "$VERSION" --require-pinned --archive-base "$target"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/anneal-package"
          clean_status="$(git status --porcelain --untracked-files=all)"
          test -z "$clean_status"
          trap 'rm -rf trusted/cargo-anneal/packaged' EXIT
          cargo run --locked -p cargo-anneal --example regenerate_bundle -- --root . --stage-package
          staged_status="$(git status --porcelain --untracked-files=all)"
          test "$staged_status" = "?? anneal/trusted/cargo-anneal/packaged/bundled_resources.rs"
          cargo package --locked --allow-dirty -p cargo-anneal
          scratch="$(mktemp -d)"
          tar -xf "$CARGO_TARGET_DIR/package/cargo-anneal-$VERSION.crate" -C "$scratch"
          (cd "$scratch" && cargo install --locked --path "cargo-anneal-$VERSION" --root "$scratch")
          export XDG_CACHE_HOME="$scratch/cache"
          cli="$scratch/bin/cargo-anneal"
          (cd "$scratch" && "$cli" setup)
          python3 -B ci/probe_alpha.py --cli "$cli"

  anneal-publish-crate:
    name: Publish cargo-anneal on crates.io
    needs: anneal-qualify-package
    runs-on: ubuntu-latest
    environment: anneal-release
    concurrency:
      group: anneal-publish-${{ needs.anneal-qualify-package.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.anneal-qualify-package.outputs.commit }}
          persist-credentials: false
      - name: Authenticate with crates.io
        id: anneal-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Stage package snapshot
        working-directory: anneal
        run: |
          set -euo pipefail
          clean_status="$(git status --porcelain --untracked-files=all)"
          test -z "$clean_status"
          trap 'rm -rf trusted/cargo-anneal/packaged' ERR
          cargo run --locked -p cargo-anneal --example regenerate_bundle -- --root . --stage-package
          staged_status="$(git status --porcelain --untracked-files=all)"
          test "$staged_status" = "?? anneal/trusted/cargo-anneal/packaged/bundled_resources.rs"
      - name: Publish the qualified workspace package
        working-directory: anneal
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.anneal-auth.outputs.token }}
        run: |
          set -euo pipefail
          trap 'rm -rf trusted/cargo-anneal/packaged' EXIT
          staged_status="$(git status --porcelain --untracked-files=all)"
          test "$staged_status" = "?? anneal/trusted/cargo-anneal/packaged/bundled_resources.rs"
          cargo publish --locked --allow-dirty -p cargo-anneal --registry crates-io

  anneal-publish-github:
    name: Publish Anneal GitHub Release
    needs: [anneal-qualify-package, anneal-publish-crate]
    runs-on: ubuntu-latest
    concurrency:
      group: anneal-github-release-${{ needs.anneal-qualify-package.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
      pull-requests: read
    env:
      ACTIONS_CACHE_URL: ''
      ACTIONS_RESULTS_URL: ''
      ACTIONS_RUNTIME_TOKEN: ''
      ACTIONS_RUNTIME_URL: ''
      RELEASE_COMMIT: ${{ needs.anneal-qualify-package.outputs.commit }}
      RELEASE_TAG: anneal-v${{ needs.anneal-qualify-package.outputs.version }}
    steps:
      - name: Checkout release workflow revision and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate Anneal release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#anneal-v}"
          printf '[cargo-anneal %s on crates.io](https://crates.io/crates/cargo-anneal/%s) · [Linux toolchain archive](https://github.com/%s/releases/tag/anneal-toolchain-v%s)\n\n' \
            "$version" "$version" "$GITHUB_REPOSITORY" "$version" \
            > "$RUNNER_TEMP/release-notes.md"
          python3 .github/release_notes.py --tag "$RELEASE_TAG" \
            --target "$RELEASE_COMMIT" --path anneal >> "$RUNNER_TEMP/release-notes.md"
      - name: Create GitHub Release
        uses: ./.github/actions/publish-github-release
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ env.RELEASE_COMMIT }}
          notes-file: ${{ runner.temp }}/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
