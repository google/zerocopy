name: Reverse-before preparation
'on':
  push:
    branches: [fix-reverse-before-transmute]
permissions:
  contents: read
  actions: read
jobs:
  split-tools:
    if: github.repository == 'google/zerocopy' && github.ref == 'refs/heads/fix-reverse-before-transmute'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: 10578315877
          run-id: 35423406852
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tools
      - name: Split public toolchain archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/tools"
          test -s reverse-before-toolchains.tar.gz
          sha256sum reverse-before-toolchains.tar.gz
          split -b 350M reverse-before-toolchains.tar.gz tools-part-
          sha256sum tools-part-*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reverse-tools-aa
          path: ${{ runner.temp }}/tools/tools-part-aa
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reverse-tools-ab
          path: ${{ runner.temp }}/tools/tools-part-ab
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reverse-tools-ac
          path: ${{ runner.temp }}/tools/tools-part-ac
          archive: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
