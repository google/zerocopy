name: Anneal Release

on:
  push:
    branches:
      - main
    paths:
      - 'anneal/v1/Cargo.toml'
      - 'exocrate/Cargo.toml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Anneal version'
        required: true
      branch:
        description: 'Branch to update'
        required: true
        default: 'main'

permissions: {}

env:
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  # Both automatic crate releases and manual toolchain releases can wait behind
  # matrix work and environment approval. Keep every intermediate artifact
  # available for the same long window; the artifact-contract test owns this
  # cross-job policy.
  ANNEAL_RELEASE_ARTIFACT_RETENTION_DAYS: "90"

concurrency:
  # A stale approval for one release must not block later versions. Duplicate
  # manual runs for the same requested version remain serialized, while each
  # automatic push has an independent outer group and a version-specific
  # publication lock below.
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.version || github.sha
    }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Don't run this on forks. Also skip it on workflow_dispatch because that
    # trigger is specifically for creating the version-bumping PR, not for
    # checking if it was already done.
    if: github.repository == 'google/zerocopy' && github.event_name != 'workflow_dispatch'
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      # Compare with the state before the entire push, not HEAD^. This matters
      # when a multi-commit push contains the version bump before its final
      # commit. Changes to exocrate alone intentionally do not release the
      # already-published cargo-anneal version; the publishability checks in
      # anneal.yml still validate the coordinated dependency immediately.
      - name: Determine if version was updated
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-crate-version-change.py \
            --before "$BEFORE" \
            --manifest anneal/v1/Cargo.toml \
            > release-version.json
          cat release-version.json
          echo "changed=$(jq -r .changed release-version.json)" \
            >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version release-version.json)" \
            >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .prerelease release-version.json)" \
            >> "$GITHUB_OUTPUT"

  prepare-crates-release:
    name: Package and inspect Anneal crates
    needs: check-version
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Packaging and crate verification execute without any publication or
      # repository-write credential. Only `.crate` bytes cross into the
      # privileged job; commands and release metadata do not.
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install repository-pinned stable Rust
        uses: ./.github/actions/install-pinned-stable

      # This same script runs for every PR in anneal.yml. Keep its dependency
      # order coordinated with the immutable plan below and with
      # anneal/v1/Cargo.toml's exact exocrate requirement.
      - name: Create deterministic crate archives
        run: |
          set -euo pipefail
          ./anneal/v1/tools/package-release-crates.sh
          mkdir release-crates
          cp exocrate/target/package/exocrate-*.crate release-crates/
          cp anneal/v1/target/package/cargo-anneal-*.crate release-crates/

      - name: Upload prepared release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anneal-crates-${{ github.sha }}
          path: release-crates/*.crate
          if-no-files-found: error
          # Release approval can be delayed. These archives are small, and a
          # long lifetime keeps the originally reviewed bytes resumable.
          retention-days: ${{ env.ANNEAL_RELEASE_ARTIFACT_RETENTION_DAYS }}
          overwrite: true

  release:
    name: Reconcile Anneal crates.io and GitHub release
    needs: [check-version, prepare-crates-release]
    if: needs.check-version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: anneal-crates-${{ needs.check-version.outputs.version }}
      cancel-in-progress: false
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install repository-pinned stable Rust
        uses: ./.github/actions/install-pinned-stable

      - name: Download prepared release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anneal-crates-${{ github.sha }}
          path: release-crates

      # Construct executable release metadata only from trusted workflow
      # constants and this exact checkout. Never take commands, paths, package
      # names, repository names, or tags from the unprivileged artifact job.
      # Keep the package order coordinated with package-release-crates.sh and
      # anneal/v1/Cargo.toml's exact exocrate dependency.
      - name: Create trusted release plan
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
          PRERELEASE: ${{ needs.check-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          EXOCRATE_VERSION="$(
            python3 -c \
              'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("exocrate/Cargo.toml").read_text())["package"]["version"])'
          )"
          PRERELEASE_ARG=()
          if [ "$PRERELEASE" = true ]; then
            PRERELEASE_ARG+=(--prerelease)
          fi
          python3 .github/scripts/create-crates-release-plan.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "anneal-v$VERSION" \
            --sha "$GITHUB_SHA" \
            --workflow anneal-release.yml \
            --environment release \
            "${PRERELEASE_ARG[@]}" \
            --cargo-command cargo \
            --package \
            "exocrate=exocrate/Cargo.toml=release-crates/exocrate-${EXOCRATE_VERSION}.crate" \
            --package \
            "cargo-anneal=anneal/v1/Cargo.toml=release-crates/cargo-anneal-${VERSION}.crate" \
            --output release-plan.json
          jq . release-plan.json

      # crates.io trusted-publisher settings are per crate. Keep both
      # `exocrate` and `cargo-anneal` configured for repository
      # google/zerocopy, workflow anneal-release.yml, environment release.
      - name: Authenticate with crates.io
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # Publish exocrate first, wait for both crates.io API and index
      # visibility, then publish cargo-anneal. Matching prior state is accepted
      # on a rerun; mismatched state fails. The tag is created last.
      - name: Reconcile release state
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/reconcile-crates-release.py \
            release-plan.json --root .

  resolve-release-source:
    name: Resolve release source
    # The workflow definition and trusted validators must come from main. The
    # independently selected source ref remains an explicit input below.
    if: |
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      # This job resolves the operator-selected ref but executes no code from
      # it. Its outputs are therefore safe to pass into privileged jobs; do not
      # move selected-branch scripts into this job after the output step.
      - name: Checkout selected ref without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve immutable identifiers
        id: resolve
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Anneal version: $VERSION" >&2
            exit 1
          fi

          BASE_SHA="$(git rev-parse HEAD)"
          if ! [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Checkout did not resolve to a commit SHA: $BASE_SHA" >&2
            exit 1
          fi
          SHORT_BASE_SHA="${BASE_SHA:0:12}"
          TAG_NAME="anneal-toolchains-v${VERSION}-${GITHUB_RUN_ID}-${SHORT_BASE_SHA}"

          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  prepare-release-source:
    name: Prepare release source patch
    needs: resolve-release-source
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.base_sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Prepare version bump patch
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -eo pipefail
          ./ci/release_anneal_version.sh "$VERSION"

          python3 anneal/v1/tools/check-release-pr-files.py \
            --context "Release version bump" \
            --include-untracked \
            --allowed anneal/v1/Cargo.lock \
            --allowed anneal/v1/Cargo.toml \
            --allowed anneal/v1/README.md \
            --required anneal/v1/Cargo.toml

          git diff --binary > anneal-release-source.patch
          if [ ! -s anneal-release-source.patch ]; then
            echo "::error::Release version bump produced an empty patch."
            exit 1
          fi

      - name: Upload release source patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anneal-release-source-patch
          path: anneal-release-source.patch
          if-no-files-found: error
          retention-days: ${{ env.ANNEAL_RELEASE_ARTIFACT_RETENTION_DAYS }}
          # A rerun can observe an artifact written by an earlier attempt whose
          # upload response was lost. Replace that exact-name artifact so the
          # release remains resumable instead of failing on a name conflict.
          overwrite: true

  build-toolchains:
    name: Build toolchain artifact (${{ matrix.target }})
    needs: resolve-release-source
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            cargo_os: linux
            cargo_arch: x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
            cargo_os: linux
            cargo_arch: aarch64
          - os: macos-15-intel
            target: macos-x86_64
            cargo_os: macos
            cargo_arch: x86_64
          - os: macos-latest
            target: macos-aarch64
            cargo_os: macos
            cargo_arch: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.base_sha }}
          persist-credentials: false

      - name: Free up disk space
        if: runner.os == 'Linux'
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8

      # On Ubuntu 24.04 (currently `ubuntu-latest`), AppArmor restricts unprivileged user namespaces by default.
      # The Nix build sandbox uses `bubblewrap` for Linux FHS execution, which requires creating a user namespace.
      - name: Enable unprivileged user namespaces (Ubuntu 24.04)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Toolchain contents depend only on the selected commit's flake inputs,
      # not on cargo-anneal's requested package version. Build the exact commit
      # and leave version-patch processing to a separate unprivileged job.
      - name: Build toolchain artifact
        env:
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve-release-source.outputs.tag_name }}
          TARGET: ${{ matrix.target }}
          CARGO_OS: ${{ matrix.cargo_os }}
          CARGO_ARCH: ${{ matrix.cargo_arch }}
        run: |
          set -eo pipefail
          ARCHIVE_NAME="anneal-toolchain-${TARGET}.tar.zst"
          MAX_GITHUB_RELEASE_ASSET_SIZE=2147483647
          mkdir -p anneal/target anneal/v1/release-metadata

          nix build ./anneal#omnibus-archive-ci --out-link "anneal/target/${ARCHIVE_NAME}"
          cp -L "anneal/target/${ARCHIVE_NAME}" "anneal/v1/${ARCHIVE_NAME}"
          ARCHIVE_SIZE="$(python3 -c 'import os, sys; print(os.path.getsize(sys.argv[1]))' "anneal/v1/${ARCHIVE_NAME}")"
          printf 'Built %s (%s bytes)\n' "$ARCHIVE_NAME" "$ARCHIVE_SIZE"
          if [ "$ARCHIVE_SIZE" -gt "$MAX_GITHUB_RELEASE_ASSET_SIZE" ]; then
            echo "::error::${ARCHIVE_NAME} is ${ARCHIVE_SIZE} bytes, which exceeds GitHub's ${MAX_GITHUB_RELEASE_ASSET_SIZE}-byte release asset limit."
            exit 1
          fi

          url="https://github.com/${GH_REPO}/releases/download/${TAG_NAME}/${ARCHIVE_NAME}"
          python3 anneal/v1/tools/collect-release-archive-metadata.py \
            --archive "anneal/v1/${ARCHIVE_NAME}" \
            --target "$TARGET" \
            --os "$CARGO_OS" \
            --arch "$CARGO_ARCH" \
            --url "$url" \
            --out "anneal/v1/release-metadata/${TARGET}.json"

      - name: Restore AppArmor restriction
        if: always() && runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1

      - name: Upload toolchain archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anneal-toolchain-${{ matrix.target }}.tar.zst
          path: anneal/v1/anneal-toolchain-${{ matrix.target }}.tar.zst
          if-no-files-found: error
          retention-days: ${{ env.ANNEAL_RELEASE_ARTIFACT_RETENTION_DAYS }}
          archive: false
          overwrite: true

      - name: Upload toolchain metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}.json
          path: anneal/v1/release-metadata/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: ${{ env.ANNEAL_RELEASE_ARTIFACT_RETENTION_DAYS }}
          archive: false
          overwrite: true

  prepare-release-pr:
    # Selected-branch helper scripts create the final reviewable patch here,
    # before any repository or release write credential is introduced.
    name: Prepare final release PR patch
    needs: [resolve-release-source, prepare-release-source, build-toolchains]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read # Required to download toolchain metadata artifacts.
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.base_sha }}
          persist-credentials: false

      - name: Download release source patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anneal-release-source-patch
          path: .

      - name: Apply release source patch
        run: |
          set -eo pipefail
          git apply --check anneal-release-source.patch
          git apply anneal-release-source.patch

      - name: Download toolchain metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*.json'
          path: anneal/v1/release-metadata
          merge-multiple: true

      - name: Update Anneal archive metadata
        env:
          TAG_NAME: ${{ needs.resolve-release-source.outputs.tag_name }}
        run: |
          set -eo pipefail
          python3 anneal/v1/tools/update-exocrate-metadata.py \
            --cargo-toml anneal/v1/Cargo.toml \
            --metadata-dir anneal/v1/release-metadata \
            --expected-release-tag "$TAG_NAME" \
            --require-all

          rm -f anneal-release-source.patch
          rm -rf anneal/v1/release-metadata

          python3 anneal/v1/tools/check-release-pr-files.py \
            --context "Release workflow" \
            --include-untracked \
            --allowed anneal/v1/Cargo.lock \
            --allowed anneal/v1/Cargo.toml \
            --allowed anneal/v1/README.md \
            --required anneal/v1/Cargo.toml

      - name: Create final release PR patch
        run: |
          set -euo pipefail
          git diff --binary > anneal-release-final.patch
          if [ ! -s anneal-release-final.patch ]; then
            echo "Final release PR patch is empty" >&2
            exit 1
          fi

      - name: Upload final release PR patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anneal-release-final-patch
          path: anneal-release-final.patch
          if-no-files-found: error
          retention-days: ${{ env.ANNEAL_RELEASE_ARTIFACT_RETENTION_DAYS }}
          overwrite: true

  review-release:
    name: Review release inputs
    needs: [resolve-release-source, prepare-release-pr, build-toolchains]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      # `github.workflow_sha` identifies the trusted workflow definition. The
      # validators from this checkout inspect selected-branch outputs as data;
      # no helper from the operator-selected branch executes in this job.
      - name: Checkout trusted validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout selected source without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.base_sha }}
          path: source
          persist-credentials: false

      - name: Download final release PR patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anneal-release-final-patch
          path: source

      - name: Download toolchain metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*.json'
          path: release-metadata
          merge-multiple: true

      - name: Validate and summarize release inputs
        env:
          BASE_SHA: ${{ needs.resolve-release-source.outputs.base_sha }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve-release-source.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 trusted/anneal/v1/tools/validate-release-artifacts.py \
            --metadata-dir release-metadata \
            --tag "$TAG_NAME" \
            --repository "$GH_REPO"

          cd source
          git apply --check anneal-release-final.patch
          git apply anneal-release-final.patch
          rm anneal-release-final.patch
          python3 ../trusted/anneal/v1/tools/check-release-pr-files.py \
            --context "Trusted release review" \
            --include-untracked \
            --allowed anneal/v1/Cargo.lock \
            --allowed anneal/v1/Cargo.toml \
            --allowed anneal/v1/README.md \
            --required anneal/v1/Cargo.toml

          {
            echo "## Anneal toolchain release"
            echo
            echo "- Source: \`$BASE_SHA\`"
            echo "- Tag: \`$TAG_NAME\`"
            echo
            echo '### Release PR changes'
            echo '```'
            git diff --stat
            echo '```'
            echo
            echo '### Toolchain archives'
            jq -r \
              '"- \(.target): \(.sha256) (\(.filename))"' \
              ../release-metadata/*.json
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release-assets:
    name: Publish toolchain release
    needs: [resolve-release-source, review-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout trusted validators
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: trusted
          persist-credentials: false

      - name: Download toolchain archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: anneal-toolchain-*.tar.zst
          path: release-assets
          merge-multiple: true

      - name: Download toolchain metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: '*.json'
          path: release-metadata
          merge-multiple: true

      - name: Validate untrusted release artifacts
        env:
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve-release-source.outputs.tag_name }}
        run: |
          set -euo pipefail
          python3 trusted/anneal/v1/tools/validate-release-artifacts.py \
            --metadata-dir release-metadata \
            --archive-dir release-assets \
            --tag "$TAG_NAME" \
            --repository "$GH_REPO"

      - name: Create or reconcile the toolchain release
        env:
          BASE_SHA: ${{ needs.resolve-release-source.outputs.base_sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.resolve-release-source.outputs.tag_name }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if RELEASE="$(
            gh release view "$TAG_NAME" \
              --repo "$GH_REPO" \
              --json isDraft,isPrerelease,tagName,targetCommitish 2>/dev/null
          )"; then
            if [ "$(jq -r .tagName <<< "$RELEASE")" != "$TAG_NAME" ] \
                || [ "$(jq -r .isPrerelease <<< "$RELEASE")" != true ] \
                || [ "$(jq -r .targetCommitish <<< "$RELEASE")" != "$BASE_SHA" ]; then
              echo "Existing release has unexpected metadata: $RELEASE" >&2
              exit 1
            fi
          else
            gh release create "$TAG_NAME" \
              --repo "$GH_REPO" \
              --target "$BASE_SHA" \
              --title "$TAG_NAME" \
              --notes "Machine-generated Anneal toolchain artifacts for cargo-anneal ${VERSION}, built from exact source commit ${BASE_SHA}." \
              --draft \
              --prerelease \
              --latest=false
            RELEASE="$(
              jq -cn --arg BASE_SHA "$BASE_SHA" '{
                isDraft: true,
                isPrerelease: true,
                targetCommitish: $BASE_SHA
              }'
            )"
          fi

          IS_DRAFT="$(jq -r .isDraft <<< "$RELEASE")"
          CHECK_DIR="$(mktemp -d)"
          trap 'rm -rf "$CHECK_DIR"' EXIT
          for ASSET in release-assets/*; do
            NAME="${ASSET##*/}"
            rm -f "$CHECK_DIR/$NAME"
            if gh release download "$TAG_NAME" \
                --repo "$GH_REPO" \
                --pattern "$NAME" \
                --dir "$CHECK_DIR" \
                --clobber 2>/dev/null \
                && cmp "$ASSET" "$CHECK_DIR/$NAME"; then
              echo "Existing release asset matches: $NAME"
              continue
            fi

            if [ "$IS_DRAFT" != true ]; then
              echo "Published release has a missing or mismatched $NAME" >&2
              exit 1
            fi
            gh release upload "$TAG_NAME" "$ASSET" \
              --repo "$GH_REPO" \
              --clobber
            rm -f "$CHECK_DIR/$NAME"
            gh release download "$TAG_NAME" \
              --repo "$GH_REPO" \
              --pattern "$NAME" \
              --dir "$CHECK_DIR" \
              --clobber
            cmp "$ASSET" "$CHECK_DIR/$NAME"
          done

          EXPECTED_ASSETS="$(
            find release-assets -mindepth 1 -maxdepth 1 -type f \
              -printf '%f\n' | sort
          )"
          ACTUAL_ASSETS="$(
            gh release view "$TAG_NAME" \
              --repo "$GH_REPO" \
              --json assets \
              --jq '.assets[].name' \
              | sort
          )"
          if [ "$ACTUAL_ASSETS" != "$EXPECTED_ASSETS" ]; then
            echo "Release has an unexpected asset set" >&2
            printf 'Expected:\n%s\nActual:\n%s\n' \
              "$EXPECTED_ASSETS" "$ACTUAL_ASSETS" >&2
            exit 1
          fi

          if [ "$IS_DRAFT" = true ]; then
            gh release edit "$TAG_NAME" \
              --repo "$GH_REPO" \
              --draft=false
          fi
          if [ "$(
            gh release view "$TAG_NAME" --repo "$GH_REPO" --json isDraft \
              --jq .isDraft
          )" != false ]; then
            echo "Toolchain release is still a draft" >&2
            exit 1
          fi

          # GitHub creates a missing tag only when a draft is published. The
          # draft's exact target was checked above; now verify the resulting
          # ref actually resolves to that commit before downstream PR CI starts
          # consuming its public URLs.
          TAG_SHA="$(
            gh api "repos/$GH_REPO/commits/$TAG_NAME" --jq .sha
          )"
          if [ "$TAG_SHA" != "$BASE_SHA" ]; then
            echo "Release tag points at $TAG_SHA, expected $BASE_SHA" >&2
            exit 1
          fi

          for METADATA in release-metadata/*.json; do
            URL="$(jq -r .url "$METADATA")"
            AVAILABLE=false
            for ATTEMPT in {1..10}; do
              if curl --fail --silent --show-error --location --head "$URL" \
                  >/dev/null; then
                AVAILABLE=true
                break
              fi
              echo "Asset is not public yet (attempt $ATTEMPT): $URL"
              sleep 6
            done
            if [ "$AVAILABLE" != true ]; then
              echo "Release asset did not become public: $URL" >&2
              exit 1
            fi
          done

  submit-release-pr:
    name: Submit Anneal release PR
    needs: [resolve-release-source, prepare-release-pr, publish-release-assets]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    steps:
      # This checkout is treated only as Git data. Before the bot token is
      # passed to the pinned PR action, inline trusted workflow code applies
      # and constrains the prepared patch without running repository scripts.
      - name: Checkout selected source without executing it
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve-release-source.outputs.base_sha }}
          persist-credentials: false

      - name: Download final release PR patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: anneal-release-final-patch
          path: .

      - name: Apply and constrain release PR patch
        run: |
          set -euo pipefail
          git apply --check anneal-release-final.patch
          git apply anneal-release-final.patch
          rm anneal-release-final.patch
          git diff --check

          mapfile -t CHANGED < <(git diff --name-only)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo "Release patch changed no tracked files" >&2
            exit 1
          fi
          FOUND_MANIFEST=false
          for PATH in "${CHANGED[@]}"; do
            case "$PATH" in
              anneal/v1/Cargo.lock|anneal/v1/Cargo.toml|anneal/v1/README.md)
                ;;
              *)
                echo "Release patch changed unexpected path: $PATH" >&2
                exit 1
                ;;
            esac
            if [ "$PATH" = anneal/v1/Cargo.toml ]; then
              FOUND_MANIFEST=true
            fi
          done
          if [ "$FOUND_MANIFEST" != true ]; then
            echo "Release patch did not change anneal/v1/Cargo.toml" >&2
            exit 1
          fi

      - name: Submit PR
        id: submit-pr-upstream
        if: github.repository == 'google/zerocopy'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1 # zizmor: ignore[superfluous-actions]
        with:
          commit-message: "Release Anneal ${{ github.event.inputs.version }}"
          author: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          committer: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          title: "Release Anneal ${{ github.event.inputs.version }}"
          base: ${{ github.event.inputs.branch }}
          branch: anneal-release-${{ github.event.inputs.version }}
          add-paths: |
            anneal/v1/Cargo.lock
            anneal/v1/Cargo.toml
            anneal/v1/README.md
          push-to-fork: google-pr-creation-bot/zerocopy
          token: ${{ secrets.GOOGLE_PR_CREATION_BOT_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Submit PR (fork test)
        id: submit-pr-fork
        if: github.repository != 'google/zerocopy'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1 # zizmor: ignore[superfluous-actions]
        with:
          commit-message: "Release Anneal ${{ github.event.inputs.version }}"
          author: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          committer: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          title: "Release Anneal ${{ github.event.inputs.version }}"
          base: ${{ github.event.inputs.branch }}
          branch: anneal-release-${{ github.event.inputs.version }}
          add-paths: |
            anneal/v1/Cargo.lock
            anneal/v1/Cargo.toml
            anneal/v1/README.md
          token: ${{ github.token }}

      - name: Add labels
        if: steps.submit-pr-upstream.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.submit-pr-upstream.outputs.pull-request-number }}
        run: gh pr edit "$PR_NUMBER" --add-label "hide-from-release-notes"

      - name: Add labels (fork test)
        if: steps.submit-pr-fork.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.submit-pr-fork.outputs.pull-request-number }}
        run: gh pr edit "$PR_NUMBER" --add-label "hide-from-release-notes"
