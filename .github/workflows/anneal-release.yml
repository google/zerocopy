name: Anneal pinned bundle validation
on:
  workflow_dispatch:
    inputs:
      bless:
        description: 'Regenerate reviewed 13 snapshots through the harness before the unblessed suite'
        type: boolean
        default: false
      v1:
        description: 'Also run cold V1 setup, unit tests and all fixtures on native Linux x86'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    name: Native validation (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0
        if: matrix.system != 'x86_64-darwin'
      - name: Install pinned upstream Nix on native Intel Mac
        if: matrix.system == 'x86_64-darwin'
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/nix-install-2.31.2"
          curl --fail --silent --show-error --location \
            https://releases.nixos.org/nix/nix-2.31.2/install -o "$installer"
          printf '%s  %s\n' \
            078e2ffeddf6a9c1f22adf41458ccc46a58bb26911a9e01579645314f9982994 \
            "$installer" | shasum -a 256 -c -
          printf 'experimental-features = nix-command flakes\nmax-jobs = 2\ncores = 2\ntrusted-users = root %s\n' \
            "$USER" > "$RUNNER_TEMP/anneal-nix.conf"
          sh "$installer" --daemon --yes --no-channel-add \
            --nix-extra-conf-file "$RUNNER_TEMP/anneal-nix.conf"
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          echo 'NIX_SSL_CERT_FILE=/etc/ssl/cert.pem' >> "$GITHUB_ENV"
      - name: Native Linux runtime prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp10 libffi8 libncurses6
      - name: Allow Nix FHS namespace
        if: runner.os == 'Linux'
        run: |
          sysctl -n kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/anneal-apparmor-before"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build, relocate, extract and prove
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          PYTHONUNBUFFERED: '1'
        run: python3 ci/validate-anneal-pin.py
      - name: Optional native Linux x86 V1 validation
        env:
          ANNEAL_VALIDATION_BLESS_REVIEWED: ${{ inputs.bless && '1' || '0' }}
        if: matrix.system == 'x86_64-linux' && inputs.v1
        run: bash ci/validate-anneal-v1.sh
      - name: Restore namespace restriction
        if: always() && runner.os == 'Linux'
        run: |
          if test -f "$RUNNER_TEMP/anneal-apparmor-before"; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$RUNNER_TEMP/anneal-apparmor-before")"
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anneal-pin-validation-${{ matrix.system }}
          path: validation-evidence/
          if-no-files-found: error
          retention-days: 3
