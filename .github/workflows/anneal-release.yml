name: Shared integrated native validation — Intel throughput
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Integrated validation (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            system: x86_64-darwin
    env:
      LEAN_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      RUSTFLAGS: ''
      RUSTDOCFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0
        if: matrix.system != 'x86_64-darwin'
      - name: Install pinned upstream Nix on native Intel Mac
        if: matrix.system == 'x86_64-darwin'
        shell: bash
        run: |
          set -euo pipefail
          installer="$RUNNER_TEMP/nix-install-2.31.2"
          curl --fail --silent --show-error --location \
            https://releases.nixos.org/nix/nix-2.31.2/install -o "$installer"
          printf '%s  %s\n' \
            078e2ffeddf6a9c1f22adf41458ccc46a58bb26911a9e01579645314f9982994 \
            "$installer" | shasum -a 256 -c -
          printf 'experimental-features = nix-command flakes\nmax-jobs = 2\ncores = 2\ntrusted-users = root %s\n' \
            "$USER" > "$RUNNER_TEMP/anneal-nix.conf"
          sh "$installer" --daemon --yes --no-channel-add \
            --nix-extra-conf-file "$RUNNER_TEMP/anneal-nix.conf"
          echo /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          echo 'NIX_SSL_CERT_FILE=/etc/ssl/cert.pem' >> "$GITHUB_ENV"
      - name: Native Intel signing and relocation preflight
        if: matrix.system == 'x86_64-darwin'
        timeout-minutes: 30
        run: bash ci/intel-signing-preflight.sh
      - name: Native Linux runtime prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp10 libffi8 libncurses6
      - name: Allow Nix FHS namespace
        if: runner.os == 'Linux'
        run: |
          sysctl -n kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/anneal-apparmor-before"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build backend with bounded retries for upstream network failures
        timeout-minutes: 210
        run: |
          set -euo pipefail
          mkdir network-retry-evidence
          sysctl hw.ncpu hw.memsize > network-retry-evidence/hardware.log
          vm_stat > network-retry-evidence/memory-before.log
          df -h / > network-retry-evidence/disk-before.log
          status=1
          for attempt in 1 2 3; do
            status=0
            nix build --no-write-lock-file --no-link --print-out-paths \
              --max-jobs 2 --cores 2 --print-build-logs "path:$PWD/anneal#aeneas-compiled" \
              > "network-retry-evidence/attempt-$attempt.log" \
              2> "network-retry-evidence/attempt-$attempt.stderr.log" || status=$?
            printf '%s\n' "$status" > "network-retry-evidence/attempt-$attempt.status"
            cat "network-retry-evidence/attempt-$attempt.stderr.log" >&2
            if test "$status" -eq 0; then break; fi
            if test "$attempt" -lt 3; then sleep 5; fi
          done
          exit "$status"
      - name: Cold production setup, extraction, proofs and controls
        timeout-minutes: 230
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: python3 -B ci/validate-shared-integration.py
      - name: Restore namespace restriction
        if: always() && runner.os == 'Linux'
        run: |
          if test -f "$RUNNER_TEMP/anneal-apparmor-before"; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$RUNNER_TEMP/anneal-apparmor-before")"
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-integrated-validation-${{ matrix.system }}
          path: |
            validation-evidence/
            intel-signing-evidence/
            network-retry-evidence/
          if-no-files-found: error
          retention-days: 3
