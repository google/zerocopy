name: Shared post-main production refresh
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Integrated validation (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            system: x86_64-linux
    env:
      LEAN_NUM_THREADS: '2'
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      RUSTFLAGS: ''
      RUSTDOCFLAGS: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0
        if: matrix.system != 'x86_64-darwin'
      - name: Native Linux runtime prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp10 libffi8 libncurses6
      - name: Allow Nix FHS namespace
        if: runner.os == 'Linux'
        run: |
          sysctl -n kernel.apparmor_restrict_unprivileged_userns > "$RUNNER_TEMP/anneal-apparmor-before"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Cold setup, fresh extraction, both proofs and pinned Rust tests
        timeout-minutes: 170
        env:
          EXPECTED_SYSTEM: ${{ matrix.system }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: python3 -B ci/validate-shared-integration.py
      - name: Restore namespace restriction
        if: always() && runner.os == 'Linux'
        run: |
          if test -f "$RUNNER_TEMP/anneal-apparmor-before"; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$(cat "$RUNNER_TEMP/anneal-apparmor-before")"
          fi
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-post-main-validation-${{ matrix.system }}
          path: |
            validation-evidence/
          if-no-files-found: error
          retention-days: 3
