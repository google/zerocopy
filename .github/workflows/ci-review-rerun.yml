name: CI Review Rerun

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI Review Signal"]
    types: [completed]

permissions: {}

jobs:
  rerun:
    name: rerun
    uses: joshlf/ci-core/.github/workflows/review-rerun.yml@440084618d8d2688a4c89512355a0c35be22f47e
    with:
      config_path: ci/checks.toml
    permissions:
      actions: write # Trigger rerun / rerun-failed-jobs on owner review changes.
      contents: read # Bare-fetch default-branch checks.toml and PR merge refs.
      pull-requests: read # Read open PRs and live owner reviews.
