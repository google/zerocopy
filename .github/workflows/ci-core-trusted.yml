name: CI (Trusted)

on:
  merge_group:
  push:
    branches:
      - main

permissions: {}

jobs:
  ci-core:
    name: ci-core
    uses: joshlf/ci-core/.github/workflows/ci.yml@a22bebce337fc26765306fc6232632db1103ea48
    with:
      config_path: ci/checks.toml
    permissions:
      actions: read # Read workflow-run and job attempt metadata.
      contents: read # Bare-fetch target and default-branch commits.
      id-token: write # Mint Fulcio OIDC certificates for batch Sigstore claims.
      packages: write # Publish verified OCI images, caches, and check receipts.
      pull-requests: read # Read live owner PR reviews on merge_group slices.
