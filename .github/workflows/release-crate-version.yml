name: Release new crate versions
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Crate version'
        required: true
      branch:
        description: 'Branch to update'
        required: true
        default: 'main'

  workflow_call:
    inputs:
      version:
        required: true
        type: string
      branch:
        required: true
        type: string
    secrets:
      GOOGLE_PR_CREATION_BOT_TOKEN:
        required: false

permissions: {}

jobs:
  release:
    concurrency:
      group: zerocopy-release-preparation-${{ inputs.branch }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write # Required to create pull requests
    runs-on: ubuntu-latest
    name: Release new crate versions
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          persist-credentials: false
          fetch-depth: 0 # Include release tags and the history of other branches.

      - name: Reject versions already in Git history
        env:
          VERSION: ${{ inputs.version }}
        run: |
          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            printf 'Version %s already has release tag %s.\n' "$VERSION" "$tag" >&2
            exit 1
          fi

          version_pattern=$(printf '%s' "$VERSION" | sed 's/[][\\.^$*+?(){}|]/\\&/g')
          commit=$(git log --all --full-history --diff-merges=first-parent --root \
            -1 --no-patch --format=%h -G "^version = \"$version_pattern\"$" -- \
            Cargo.toml zerocopy-derive/Cargo.toml \
            zerocopy/Cargo.toml zerocopy/zerocopy-derive/Cargo.toml)
          if [ -n "$commit" ]; then
            printf 'Version %s already appears in Git history (commit %s).\n' "$VERSION" "$commit" >&2
            exit 1
          fi

      - name: Overwrite Cargo.toml files
        env:
          VERSION: ${{ inputs.version }}
        run: ./zerocopy/ci/release_crate_version.sh "$VERSION"

      - name: Submit PR
        id: submit-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1 # zizmor: ignore[superfluous-actions]
        with:
          commit-message: "Release ${{ inputs.version }}"
          author: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          committer: Google PR Creation Bot <github-pull-request-creation-bot@google.com>
          title: "Release ${{ inputs.version }}"
          branch: release-${{ inputs.version }}
          push-to-fork: google-pr-creation-bot/zerocopy
          token: ${{ secrets.GOOGLE_PR_CREATION_BOT_TOKEN }} # zizmor: ignore[secrets-outside-env]

      - name: Add labels
        if: steps.submit-pr.outputs.pull-request-operation == 'created'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.submit-pr.outputs.pull-request-number }}
        run: gh pr edit "$PR_NUMBER" --add-label "hide-from-release-notes"
